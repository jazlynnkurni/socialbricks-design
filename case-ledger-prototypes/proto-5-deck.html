<!doctype html>
<meta charset="utf-8">
<!--
  Fostr Chronicle · Case Ledger — Prototype 5: The Command Deck
  A keyboard-first power tool. Committed dark terminal surface.
  Self-contained; only external request is ../shared/data.js
-->
<title>Case Ledger — Command Deck · Fostr Chronicle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ground:#0F1113;
    --panel:#14161A;
    --panel-2:#191C21;
    --panel-3:#1E2228;
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.12);
    --ink:#E6E7E3;
    --ink-2:#B7BAB4;
    --muted:#878C85;
    --faint:#5E6360;
    --accent:#5DA1A1;
    --accent-dim:#3E6E6E;
    --accent-glow:rgba(93,161,161,.16);
    /* earthy semantic status — NOT the accent */
    --s-needs:#C0632F;
    --s-prog:#B4802E;
    --s-queue:#6E7FA0;
    --s-done:#767B74;
    /* source-breakdown hues (from data.js sourceMeta, tuned for dark) */
    --src-system:#3F7E6E;
    --src-dictated:#B4802E;
    --src-needs:#C0632F;
    --src-blank:#585D5A;

    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --r:6px;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  /* faint scanline-free terminal vignette */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(93,161,161,.05), transparent 55%),
      radial-gradient(140% 120% at 50% 120%, rgba(0,0,0,.35), transparent 60%);
  }

  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"ss01" 1}
  .kbd{
    font-family:var(--mono);font-size:11px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;
    border:1px solid var(--line-2);border-bottom-width:2px;
    border-radius:4px;background:var(--panel-3);color:var(--ink-2);
    box-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .kbd.accent{color:var(--accent);border-color:var(--accent-dim)}

  /* ---- App shell ---- */
  .app{
    position:relative;z-index:1;
    height:100vh;height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
  }

  /* ---- Top bar ---- */
  .topbar{
    display:flex;align-items:center;gap:22px;
    padding:11px 18px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .mark{
    width:22px;height:22px;flex:none;border-radius:5px;
    background:radial-gradient(circle at 32% 30%,var(--accent),var(--accent-dim));
    box-shadow:0 0 0 1px rgba(93,161,161,.35), 0 0 14px -4px var(--accent);
    position:relative;
  }
  .brand .mark::after{content:"";position:absolute;inset:6px;border-radius:2px;background:var(--ground);opacity:.55}
  .brand .name{font-weight:600;letter-spacing:.02em;font-size:13.5px}
  .brand .sub{color:var(--faint);font-size:11px;font-family:var(--mono);letter-spacing:.02em}

  .counter{
    margin-left:2px;display:flex;align-items:baseline;gap:10px;
    padding:6px 14px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--panel);
    position:relative;
  }
  .counter .big{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:30px;line-height:.9;font-weight:600;letter-spacing:-.01em;
    color:var(--accent);
    text-shadow:0 0 22px rgba(93,161,161,.28);
  }
  .counter .unit{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .counter .cap{
    position:absolute;top:-8px;left:12px;background:var(--panel);
    padding:0 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  }
  .counter.tick{animation:tick .5s ease}
  @keyframes tick{
    0%{}
    18%{box-shadow:0 0 0 1px var(--accent-dim),0 0 26px -6px var(--accent)}
    100%{box-shadow:none}
  }
  .counter.tick .big{animation:bump .5s ease}
  @keyframes bump{18%{transform:translateY(-1px)}100%{transform:none}}

  .float{
    position:absolute;right:12px;top:-4px;
    font-family:var(--mono);font-size:12px;color:var(--accent);
    opacity:0;pointer-events:none;
  }
  .float.go{animation:floatUp 1.1s ease forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(4px)}
    22%{opacity:1}
    100%{opacity:0;transform:translateY(-14px)}
  }

  .stats{display:flex;gap:0;margin-left:auto;align-items:stretch}
  .stat{padding:2px 16px;border-left:1px solid var(--line);text-align:right}
  .stat:first-child{border-left:0}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--ink)}
  .stat .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

  .cmdbtn{
    display:flex;align-items:center;gap:8px;
    padding:6px 10px 6px 12px;border-radius:var(--r);
    background:var(--panel-3);border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;cursor:pointer;
  }
  .cmdbtn:hover{border-color:var(--line-2);color:var(--ink-2)}
  .cmdbtn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

  /* ---- Main split ---- */
  .main{display:grid;grid-template-columns:minmax(0,1fr) 384px;min-height:0}
  .caseload{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}

  .colhead{
    display:flex;align-items:center;gap:12px;
    padding:9px 18px;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .colhead h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .colhead .count{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .colhead .legend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted)}
  .colhead .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
  .dot.needs_review{background:var(--s-needs)}
  .dot.in_progress{background:var(--s-prog)}
  .dot.in_queue{background:var(--s-queue)}
  .dot.updated{background:var(--s-done)}

  .tablewrap{overflow:auto;min-height:0;flex:1}
  .tablewrap:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-dim)}
  table{border-collapse:collapse;width:100%;min-width:640px}
  thead th{
    position:sticky;top:0;z-index:2;
    background:var(--panel);
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;
    text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.r{text-align:right}
  tbody tr{border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}
  tbody tr:hover{background:rgba(255,255,255,.022)}
  tbody td{padding:9px 14px;vertical-align:middle}
  tbody tr.sel{background:var(--accent-glow)}
  tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
  tbody tr.filed{animation:filedflash .7s ease}
  @keyframes filedflash{0%{background:rgba(93,161,161,.28)}100%{}}

  .cell-status{width:26px}
  .cell-status .dot{margin:0 auto}
  .who{display:flex;align-items:baseline;gap:8px;min-width:0}
  .who .nm{font-weight:500;color:var(--ink);white-space:nowrap}
  .who .ag{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .safety{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;
    color:var(--s-needs);border:1px solid rgba(192,99,47,.4);border-radius:3px;padding:0 4px;line-height:14px;
  }
  .st-label{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}

  /* mini source meter */
  .meter{display:flex;height:7px;width:118px;border-radius:2px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px var(--line)}
  .meter i{height:100%;display:block}
  .due{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
  .due.overdue{color:var(--s-needs);font-weight:600}
  .ret{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);white-space:nowrap}
  .ret b{color:var(--accent);font-weight:600}
  .ret.zero{color:var(--faint)}

  /* ---- Detail rail ---- */
  .rail{display:flex;flex-direction:column;min-height:0;background:var(--panel);overflow:auto}
  .rail-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .rail-head .eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .rail-head .who2{display:flex;align-items:center;gap:10px}
  .rail-head .nm2{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .rail-head .meta2{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .rail-head .meta2 b{color:var(--ink-2);font-weight:500}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;
    border:1px solid var(--line-2);color:var(--ink-2);
  }

  .rail-sec{padding:15px 18px;border-bottom:1px solid var(--line)}
  .rail-sec h3{margin:0 0 12px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;justify-content:space-between}
  .rail-sec h3 .rt{color:var(--muted)}

  /* the math block */
  .math{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .math .row{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line)}
  .math .row:last-child{border-bottom:0}
  .math .row .k{color:var(--muted);font-size:12px}
  .math .row .k small{display:block;font-size:10px;color:var(--faint);letter-spacing:0}
  .math .row .v{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}
  .math .row.sub .v{color:var(--faint)}
  .math .total{background:linear-gradient(180deg,rgba(93,161,161,.1),rgba(93,161,161,.03))}
  .math .total .k{color:var(--ink)}
  .math .total .v{color:var(--accent);font-size:18px;font-weight:600}

  .breakbar{display:flex;height:11px;border-radius:3px;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line)}
  .breakbar i{height:100%}
  .srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .srcrow{display:flex;align-items:center;gap:8px;font-size:12px}
  .srcrow .sq{width:9px;height:9px;border-radius:2px;flex:none}
  .srcrow .sl{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srcrow .sn{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* 11 fields */
  .fields{display:flex;flex-direction:column;gap:1px}
  .fld{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:12.5px}
  .fld .fdot{width:7px;height:7px;border-radius:50%;flex:none}
  .fld .flab{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fld .fsrc{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .fld .manual{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--s-needs);border:1px solid rgba(192,99,47,.35);border-radius:3px;padding:0 4px;line-height:14px}

  /* ---- Status bar ---- */
  .statusbar{
    display:flex;align-items:center;gap:18px;
    padding:7px 16px;
    background:var(--panel-2);border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);
    min-height:32px;
  }
  .statusbar .msg{color:var(--ink-2);font-family:var(--mono);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .statusbar .msg.flash{color:var(--accent)}
  .hints{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .hint{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}

  /* ---- Command palette ---- */
  .scrim{
    position:fixed;inset:0;z-index:40;
    background:rgba(6,7,8,.55);backdrop-filter:blur(2px);
    display:none;
  }
  .scrim.open{display:block}
  .palette{
    position:fixed;z-index:41;left:50%;top:11vh;transform:translateX(-50%) translateY(-6px);
    width:min(620px,92vw);
    background:var(--panel-2);
    border:1px solid var(--line-2);
    border-radius:10px;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.8),0 0 0 1px rgba(93,161,161,.1);
    display:none;overflow:hidden;
    opacity:0;
  }
  .palette.open{display:block;animation:palIn .13s ease forwards}
  @keyframes palIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .pal-input{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .pal-input .chev{font-family:var(--mono);color:var(--accent);font-size:15px}
  .pal-input input{
    flex:1;background:transparent;border:0;outline:none;color:var(--ink);
    font-family:var(--sans);font-size:16px;letter-spacing:-.01em;
  }
  .pal-input input::placeholder{color:var(--faint)}
  .pal-input .esc{font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}

  .pal-list{max-height:min(52vh,440px);overflow:auto;padding:6px}
  .pal-group{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);padding:9px 12px 5px}
  .pal-item{
    display:flex;align-items:center;gap:12px;
    padding:9px 12px;border-radius:var(--r);cursor:pointer;
    scroll-margin:8px;
  }
  .pal-item .ic{
    width:26px;height:26px;flex:none;border-radius:5px;
    display:grid;place-items:center;
    background:var(--panel-3);border:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .pal-item .ic .dot{width:9px;height:9px;box-shadow:none}
  .pal-item .txt{flex:1;min-width:0}
  .pal-item .t{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-item .t b{color:var(--accent);font-weight:600}
  .pal-item .s{font-size:11px;color:var(--faint);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-item .go{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
  .pal-item.active{background:var(--accent-glow)}
  .pal-item.active .ic{border-color:var(--accent-dim);color:var(--accent)}
  .pal-item.active .t{color:var(--ink)}
  .pal-item.active .go{color:var(--accent)}
  .pal-empty{padding:26px 16px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:12.5px}

  :focus-visible{outline:none}
  .cmdbtn:focus-visible,.tablewrap:focus-visible{}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#22262b;border-radius:10px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:860px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    .main{grid-template-columns:1fr}
    .caseload{border-right:0;border-bottom:1px solid var(--line)}
    .tablewrap{max-height:60vh}
    .stats{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition:none !important}
  }
</style>

<div class="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <div class="name">Case Ledger</div>
        <div class="sub">command&nbsp;deck</div>
      </div>
    </div>

    <div class="counter" id="counter">
      <span class="cap">min returned</span>
      <span class="big num" id="counterVal">0</span>
      <span class="unit" id="counterClock">0h 0m</span>
      <span class="float num" id="counterFloat"></span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v num" id="statFiled">12</div><div class="l">filed</div></div>
      <div class="stat"><div class="v num" id="statQueue">5</div><div class="l">in queue</div></div>
      <div class="stat"><div class="v num" id="statFields">6.1</div><div class="l">of 11 auto</div></div>
    </div>

    <button class="cmdbtn" id="openBtn" aria-label="Open command palette">
      <span>Search &amp; commands</span>
      <span class="kbd accent">⌘</span><span class="kbd accent">K</span>
    </button>
  </header>

  <!-- MAIN -->
  <div class="main">
    <section class="caseload">
      <div class="colhead">
        <h2>Caseload</h2>
        <span class="count" id="caseCount"></span>
        <div class="legend">
          <span><i class="dot needs_review"></i>needs review</span>
          <span><i class="dot in_progress"></i>in progress</span>
          <span><i class="dot in_queue"></i>in queue</span>
          <span><i class="dot updated"></i>updated</span>
        </div>
      </div>
      <div class="tablewrap" id="tablewrap" tabindex="0" role="region" aria-label="Caseload table, use j and k to move">
        <table>
          <thead>
            <tr>
              <th class="cell-status"></th>
              <th>Case</th>
              <th>Status</th>
              <th>Sources · 11</th>
              <th>Next visit</th>
              <th class="r">Returned</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- DETAIL RAIL -->
    <aside class="rail" id="rail" aria-live="polite"></aside>
  </div>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <span class="msg" id="statusMsg">Ready.</span>
    <div class="hints">
      <span class="hint"><span class="kbd">⌘</span><span class="kbd">K</span> commands</span>
      <span class="hint"><span class="kbd">j</span><span class="kbd">k</span> move</span>
      <span class="hint"><span class="kbd">f</span> file selected</span>
      <span class="hint"><span class="kbd">/</span> search</span>
      <span class="hint"><span class="kbd">esc</span> close</span>
    </div>
  </footer>
</div>

<!-- COMMAND PALETTE -->
<div class="scrim" id="scrim"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-input">
    <span class="chev">⌘</span>
    <input id="palInput" type="text" placeholder="Jump to a case or run a command…" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list">
    <span class="esc">esc</span>
  </div>
  <div class="pal-list" id="palList" role="listbox" aria-label="Results"></div>
</div>

<script src="../shared/data.js"></script>
<script>
(function(){
  "use strict";
  const L = window.LEDGER;
  const M = L.model, SM = L.sourceMeta, fmt = L.fmt;
  const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const $ = s => document.querySelector(s);

  const RANK = { needs_review:0, in_progress:1, in_queue:2, updated:3 };
  const ST_LABEL = { needs_review:"Needs review", in_progress:"In progress", in_queue:"In queue", updated:"Updated" };
  const SRC_COLOR = { system:"var(--src-system)", dictated:"var(--src-dictated)", needs_look:"var(--src-needs)", blank:"var(--src-blank)" };
  const SRC_ORDER = ["system","dictated","needs_look","blank"];

  // working copy of cases (mutable — filing changes status)
  let cases = L.cases.map(c => Object.assign({}, c, { sc: Object.assign({}, c.sc) }));
  let selId = null;

  function sorted(){
    return cases.slice().sort((a,b)=>{
      const r = RANK[a.status]-RANK[b.status];
      if(r) return r;
      return L.cases.findIndex(x=>x.id===a.id) - L.cases.findIndex(x=>x.id===b.id);
    });
  }
  const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  /* ===================== COUNTER ===================== */
  let savedNow = 0;
  const targetStart = L.month.minutesSaved; // 132
  const elVal = $("#counterVal"), elClock = $("#counterClock"), elCounter = $("#counter"), elFloat = $("#counterFloat");

  function renderCounter(){
    elVal.textContent = Math.round(savedNow);
    elClock.textContent = fmt.hm(Math.round(savedNow));
  }
  function animateCounter(to, dur){
    if(reduce){ savedNow = to; renderCounter(); return; }
    const from = savedNow, t0 = performance.now();
    (function step(now){
      const p = Math.min(1,(now-t0)/dur);
      const e = 1-Math.pow(1-p,3);
      savedNow = from + (to-from)*e;
      renderCounter();
      if(p<1) requestAnimationFrame(step);
      else { savedNow = to; renderCounter(); }
    })(performance.now());
  }

  /* ===================== TABLE ===================== */
  const rowsEl = $("#rows");

  function meter(sc){
    return SRC_ORDER.map(k=>{
      const n = sc[k]||0;
      return n ? `<i style="width:${(n/11*100).toFixed(2)}%;background:${SRC_COLOR[k]}" title="${SM[k].label}: ${n}"></i>` : "";
    }).join("");
  }

  function renderTable(){
    const list = sorted();
    rowsEl.innerHTML = list.map(c=>{
      const dueClass = c.due==="overdue" ? "due overdue" : "due";
      const dueTxt = c.due==="overdue" ? "OVERDUE" : c.due;
      const retClass = c.status==="updated" ? "ret" : "ret";
      return `<tr data-id="${c.id}" tabindex="-1" aria-selected="false">
        <td class="cell-status"><span class="dot ${c.status}" title="${ST_LABEL[c.status]}"></span></td>
        <td><div class="who"><span class="nm">${esc(c.name)}</span><span class="ag num">${c.age}y</span>${c.safety?'<span class="safety">SAFETY</span>':""}</div></td>
        <td><span class="st-label">${ST_LABEL[c.status]}</span></td>
        <td><div class="meter" role="img" aria-label="source mix">${meter(c.sc)}</div></td>
        <td><span class="${dueClass}">${dueTxt}</span></td>
        <td><span class="ret"><b>+${c.saved}</b> min</span></td>
      </tr>`;
    }).join("");
    $("#caseCount").textContent = list.length + " cases · sorted by attention";
    // rebind rows to selection
    [...rowsEl.querySelectorAll("tr")].forEach(tr=>{
      tr.addEventListener("click", ()=>select(tr.dataset.id));
    });
    markSelection();
  }

  function markSelection(){
    [...rowsEl.querySelectorAll("tr")].forEach(tr=>{
      const on = tr.dataset.id===selId;
      tr.classList.toggle("sel", on);
      tr.setAttribute("aria-selected", on?"true":"false");
    });
  }

  function select(id, scroll){
    selId = id;
    markSelection();
    renderRail();
    if(scroll){
      const tr = rowsEl.querySelector(`tr[data-id="${id}"]`);
      if(tr) tr.scrollIntoView({block:"nearest", behavior: reduce?"auto":"smooth"});
    }
  }

  function moveSel(dir){
    const list = sorted();
    let i = list.findIndex(c=>c.id===selId);
    if(i<0) i = 0; else i = Math.max(0, Math.min(list.length-1, i+dir));
    select(list[i].id, true);
  }

  /* ===================== DETAIL RAIL ===================== */
  const railEl = $("#rail");

  function railSourceRows(sc){
    return SRC_ORDER.map(k=>{
      const meta = SM[k];
      return `<div class="srcrow">
        <span class="sq" style="background:${SRC_COLOR[k]}"></span>
        <span class="sl">${meta.label}</span>
        <span class="sn num">${sc[k]||0}</span>
      </div>`;
    }).join("");
  }

  // deterministically assign each of the 11 canonical fields a source that
  // matches this case's source_counts (sc) — proves the per-note breakdown.
  function fieldSourcesForCase(sc){
    const pool = [];
    SRC_ORDER.forEach(k=>{ for(let i=0;i<(sc[k]||0);i++) pool.push(k); });
    // order canonical fields so high-risk/required narrative-ish stay meaningful;
    // we simply zip canonical field order with the pool.
    return L.fields.map((f,i)=> ({ f, src: pool[i] || f.source }));
  }

  function renderRail(){
    const c = cases.find(x=>x.id===selId);
    if(!c){ railEl.innerHTML = ""; return; }
    const sys = c.sc.system||0;
    const fieldRows = fieldSourcesForCase(c.sc).map(({f,src})=>{
      // high-risk safety fields are manual-only — never auto-filled
      const shownSrc = f.highRisk ? "dictated" : src;
      const meta = SM[shownSrc];
      return `<div class="fld">
        <span class="fdot" style="background:${SRC_COLOR[shownSrc]}"></span>
        <span class="flab">${esc(f.label)}</span>
        ${f.highRisk?'<span class="manual">MANUAL</span>':""}
        <span class="fsrc">${meta.verb}</span>
      </div>`;
    }).join("");

    const breakSegs = SRC_ORDER.map(k=>{
      const n = c.sc[k]||0;
      return n?`<i style="width:${(n/11*100).toFixed(2)}%;background:${SRC_COLOR[k]}"></i>`:"";
    }).join("");

    const filed = c.status==="updated";

    railEl.innerHTML = `
      <div class="rail-head">
        <div class="eyebrow">Selected case · check-in-v1</div>
        <div class="who2">
          <span class="dot ${c.status}"></span>
          <span class="nm2">${esc(c.name)}</span>
        </div>
        <div class="meta2">
          <span>age <b>${c.age}</b></span>
          <span>last visit <b>${esc(c.lastVisit)}</b></span>
          <span>next <b class="${c.due==="overdue"?"":""}">${esc(c.due)}</b></span>
          <span class="pill">${ST_LABEL[c.status]}</span>
        </div>
      </div>

      <div class="rail-sec">
        <h3>Time returned <span class="rt">this note</span></h3>
        <div class="math">
          <div class="row sub"><span class="k">Old way — retype 11 fields<small>context lookup · retype · narrative · file</small></span><span class="v num">${fmt.clock(M.baselineMinutes)}</span></div>
          <div class="row sub"><span class="k">In Chronicle<small>confirm ${sys} pre-filled · capture what's new · sign</small></span><span class="v num">−&nbsp;${fmt.clock(M.chronicleMinutes)}</span></div>
          <div class="row total"><span class="k">Returned to you</span><span class="v num">${c.saved} min</span></div>
        </div>
      </div>

      <div class="rail-sec">
        <h3>Source mix <span class="rt">${sys} of 11 from the record</span></h3>
        <div class="breakbar">${breakSegs}</div>
        <div class="srcgrid">${railSourceRows(c.sc)}</div>
      </div>

      <div class="rail-sec" style="border-bottom:0">
        <h3>The 11 fields <span class="rt">${filed?"filed":"awaiting review"}</span></h3>
        <div class="fields">${fieldRows}</div>
      </div>
    `;
  }

  /* ===================== FILING ===================== */
  function setStatus(msg, flash){
    const el = $("#statusMsg");
    el.textContent = msg;
    el.classList.toggle("flash", !!flash);
  }

  function bumpCounter(delta){
    if(!delta) return;
    animateCounter(savedNow + delta, reduce?0:650);
    if(!reduce){
      elCounter.classList.remove("tick"); void elCounter.offsetWidth; elCounter.classList.add("tick");
      elFloat.textContent = "+"+delta;
      elFloat.classList.remove("go"); void elFloat.offsetWidth; elFloat.classList.add("go");
    }
  }
  function updStats(){
    $("#statFiled").textContent = cases.filter(c=>c.status==="updated").length;
    $("#statQueue").textContent = cases.filter(c=>c.status==="in_queue").length;
  }

  function fileCase(id, silent){
    const c = cases.find(x=>x.id===id);
    if(!c) return 0;
    if(c.status==="updated"){ if(!silent) setStatus("· "+c.name+" is already filed — nothing to submit."); return 0; }
    c.status = "updated";
    renderTable();
    const tr = rowsEl.querySelector(`tr[data-id="${id}"]`);
    if(tr && !reduce){ tr.classList.add("filed"); }
    bumpCounter(c.saved);
    updStats();
    if(id===selId) renderRail();
    if(!silent) setStatus("· Filed "+c.name+" without retyping — "+c.saved+" min returned.", true);
    return c.saved;
  }

  function fileAllQueue(){
    const q = cases.filter(c=>c.status==="in_queue");
    if(!q.length){ setStatus("· Queue is clear — nothing waiting to submit."); return; }
    let total=0, n=0;
    q.forEach(c=>{ c.status="updated"; total+=c.saved; n++; });
    renderTable();
    bumpCounter(total);
    updStats();
    renderRail();
    setStatus("· Filed "+n+" queued notes — "+total+" min returned in one pass.", true);
  }

  /* ===================== COMMAND PALETTE ===================== */
  const scrim=$("#scrim"), palette=$("#palette"), input=$("#palInput"), listEl=$("#palList");
  let paletteOpen=false, activeIdx=0, current=[];

  const commands = [
    { id:"next",    title:"Open next case",        sub:"advance selection down the list", go:"↵", ic:"→",
      run:()=>{ moveSel(1); const c=cases.find(x=>x.id===selId); setStatus("· Opened "+c.name+"."); } },
    { id:"needs",   title:"Jump to needs review",  sub:"first case flagged for attention", go:"↵", ic:"!",
      run:()=>{ const c=sorted().find(x=>x.status==="needs_review"); if(c){select(c.id,true);setStatus("· "+c.name+" needs review.");} } },
    { id:"queue",   title:"Review queue",          sub:"first verified note waiting to file", go:"↵", ic:"≡",
      run:()=>{ const c=sorted().find(x=>x.status==="in_queue"); if(c){select(c.id,true);setStatus("· "+c.name+" — verified, ready to file.");} else setStatus("· Queue is clear.");} },
    { id:"prepare", title:"Prepare next visit",    sub:"open a pre-filled note for the next due", go:"↵", ic:"+",
      run:()=>{ const c=sorted().find(x=>x.status!=="updated")||sorted()[0]; if(c){select(c.id,true);setStatus("· Prepared note for "+c.name+" — opens already filled from the record.");} } },
    { id:"file",    title:"File selected case",    sub:"submit to records without retyping", go:"f", ic:"✓",
      run:()=>{ if(selId) fileCase(selId); } },
    { id:"fileall", title:"File all in queue",     sub:"submit every verified note at once", go:"↵", ic:"⇧",
      run:()=>fileAllQueue() },
  ];

  function fuzzy(q, text){
    if(!q) return { score:0, idx:[] };
    const ql=q.toLowerCase(), tl=text.toLowerCase();
    let qi=0, streak=0, score=0; const idx=[];
    for(let ti=0; ti<tl.length && qi<ql.length; ti++){
      if(ql[qi]===tl[ti]){
        idx.push(ti); streak++; score += 10 + streak*2;
        if(ti===0 || /\s/.test(tl[ti-1])) score += 15;
        qi++;
      } else streak = 0;
    }
    return qi===ql.length ? { score, idx } : null;
  }
  function hl(text, idx){
    if(!idx || !idx.length) return esc(text);
    const set = new Set(idx); let out="";
    for(let i=0;i<text.length;i++){
      const ch = esc(text[i]);
      out += set.has(i) ? "<b>"+ch+"</b>" : ch;
    }
    return out;
  }

  function buildResults(q){
    const cmdItems = commands.map(cmd=>{
      const m = fuzzy(q, cmd.title);
      if(m===null) return null;
      return { kind:"command", data:cmd, score:m.score+40, idx:m.idx };
    }).filter(Boolean);

    const caseItems = sorted().map(c=>{
      const label = c.name;
      const m = fuzzy(q, label + " " + ST_LABEL[c.status]);
      if(m===null) return null;
      // only keep highlight idx that fall within the name
      const idx = m.idx.filter(i=>i<label.length);
      return { kind:"case", data:c, score:m.score, idx };
    }).filter(Boolean);

    if(q){
      const all = cmdItems.concat(caseItems).sort((a,b)=>b.score-a.score);
      return all;
    }
    // empty query: commands first, then caseload in attention order
    return cmdItems.concat(caseItems);
  }

  function renderResults(){
    const q = input.value.trim();
    current = buildResults(q);
    if(activeIdx >= current.length) activeIdx = Math.max(0,current.length-1);

    if(!current.length){
      listEl.innerHTML = '<div class="pal-empty">No matches for “'+esc(q)+'”</div>';
      return;
    }

    let html="", lastKind=null;
    current.forEach((it,i)=>{
      if(it.kind!==lastKind){
        html += '<div class="pal-group">'+(it.kind==="command"?"Commands":"Caseload")+'</div>';
        lastKind = it.kind;
      }
      if(it.kind==="command"){
        const c=it.data;
        html += `<div class="pal-item${i===activeIdx?" active":""}" data-i="${i}" role="option" aria-selected="${i===activeIdx}">
          <span class="ic">${c.ic}</span>
          <span class="txt"><div class="t">${hl(c.title,it.idx)}</div><div class="s">${esc(c.sub)}</div></span>
          <span class="go">${c.go==="↵"?"↵":'<span class="kbd">'+c.go+'</span>'}</span>
        </div>`;
      } else {
        const c=it.data;
        html += `<div class="pal-item${i===activeIdx?" active":""}" data-i="${i}" role="option" aria-selected="${i===activeIdx}">
          <span class="ic"><span class="dot ${c.status}"></span></span>
          <span class="txt"><div class="t">${hl(c.name,it.idx)} <span style="color:var(--faint);font-family:var(--mono);font-size:11px">${c.age}y</span></div>
          <div class="s">${ST_LABEL[c.status]} · next ${esc(c.due)} · +${c.saved} min</div></span>
          <span class="go">open ↵</span>
        </div>`;
      }
    });
    listEl.innerHTML = html;

    [...listEl.querySelectorAll(".pal-item")].forEach(el=>{
      el.addEventListener("mousemove", ()=>{ const i=+el.dataset.i; if(i!==activeIdx){ activeIdx=i; paintActive(); } });
      el.addEventListener("click", ()=>{ activeIdx=+el.dataset.i; runActive(); });
    });
  }

  function paintActive(){
    [...listEl.querySelectorAll(".pal-item")].forEach(el=>{
      const on = +el.dataset.i===activeIdx;
      el.classList.toggle("active", on);
      el.setAttribute("aria-selected", on?"true":"false");
      if(on) el.scrollIntoView({block:"nearest"});
    });
  }

  function runActive(){
    const it = current[activeIdx];
    if(!it) return;
    closePalette();
    if(it.kind==="command") it.data.run();
    else { select(it.data.id,true); setStatus("· Opened "+it.data.name+"."); }
  }

  function openPalette(){
    paletteOpen=true; activeIdx=0;
    scrim.classList.add("open"); palette.classList.add("open");
    input.value=""; renderResults();
    input.focus();
  }
  function closePalette(){
    paletteOpen=false;
    scrim.classList.remove("open"); palette.classList.remove("open");
    $("#tablewrap").focus();
  }

  /* ===================== KEYBOARD ===================== */
  document.addEventListener("keydown", e=>{
    // open palette
    if((e.key==="k"||e.key==="K") && (e.metaKey||e.ctrlKey)){ e.preventDefault(); paletteOpen?closePalette():openPalette(); return; }

    if(paletteOpen){
      if(e.key==="Escape"){ e.preventDefault(); closePalette(); }
      else if(e.key==="ArrowDown"){ e.preventDefault(); if(current.length){ activeIdx=(activeIdx+1)%current.length; paintActive(); } }
      else if(e.key==="ArrowUp"){ e.preventDefault(); if(current.length){ activeIdx=(activeIdx-1+current.length)%current.length; paintActive(); } }
      else if(e.key==="Enter"){ e.preventDefault(); runActive(); }
      return;
    }

    // not in palette
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(typing) return;

    if(e.key==="/"){ e.preventDefault(); openPalette(); }
    else if(e.key==="j"||e.key==="ArrowDown"){ e.preventDefault(); moveSel(1); }
    else if(e.key==="k"||e.key==="ArrowUp"){ e.preventDefault(); moveSel(-1); }
    else if(e.key==="f"||e.key==="F"){ e.preventDefault(); if(selId) fileCase(selId); }
    else if(e.key==="Escape"){ /* nothing open */ }
  });

  input.addEventListener("input", ()=>{ activeIdx=0; renderResults(); });
  $("#openBtn").addEventListener("click", openPalette);
  scrim.addEventListener("click", closePalette);

  /* ===================== INIT ===================== */
  renderTable();
  updStats();
  select(sorted()[0].id);           // start on the most-needs-attention case
  animateCounter(targetStart, reduce?0:1200);
  setStatus("Ready · "+L.month.filed+" notes filed in "+L.month.label+" · "+fmt.hm(targetStart)+" returned.");
})();
</script>

</body>
</html>
