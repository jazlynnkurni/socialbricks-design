<!doctype html>
<meta charset="utf-8">
<title>Quiet Capture — Fostr Chronicle Case Ledger</title>
<style>
  /* ============================================================
     Quiet Capture — the calm flow of writing one note.
     One field at a time. Confirm what's known, type what's new.
     ============================================================ */
  :root {
    --paper:   #FBFBF9;
    --raise:   #FFFFFF;
    --ink:     #23302B;
    --muted:   #6E7A72;
    --faint:   #98A199;
    --hair:    #E7E6DE;
    --hair-2:  #EFEEE7;
    --teal:    #5DA1A1;
    --teal-ink:#3F7E7E;
    --teal-wash: rgba(93,161,161,0.10);
    --teal-line: rgba(93,161,161,0.28);
    --caution: #A9702F;
    --caution-wash: rgba(169,112,47,0.09);
    --shadow: 0 1px 2px rgba(35,48,43,0.04), 0 14px 40px -22px rgba(35,48,43,0.18);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:   #141A17;
      --raise:   #1B221E;
      --ink:     #EAEDE7;
      --muted:   #9BA69D;
      --faint:   #6E7A72;
      --hair:    #29322D;
      --hair-2:  #222A26;
      --teal:    #6FB3B3;
      --teal-ink:#8CC6C6;
      --teal-wash: rgba(111,179,179,0.12);
      --teal-line: rgba(111,179,179,0.34);
      --caution: #D0975A;
      --caution-wash: rgba(208,151,90,0.12);
      --shadow: 0 1px 2px rgba(0,0,0,0.30), 0 18px 48px -24px rgba(0,0,0,0.66);
    }
  }
  :root[data-theme="light"] {
    --paper:#FBFBF9; --raise:#FFFFFF; --ink:#23302B; --muted:#6E7A72; --faint:#98A199;
    --hair:#E7E6DE; --hair-2:#EFEEE7; --teal:#5DA1A1; --teal-ink:#3F7E7E;
    --teal-wash:rgba(93,161,161,0.10); --teal-line:rgba(93,161,161,0.28);
    --caution:#A9702F; --caution-wash:rgba(169,112,47,0.09);
    --shadow:0 1px 2px rgba(35,48,43,0.04), 0 14px 40px -22px rgba(35,48,43,0.18);
  }
  :root[data-theme="dark"] {
    --paper:#141A17; --raise:#1B221E; --ink:#EAEDE7; --muted:#9BA69D; --faint:#6E7A72;
    --hair:#29322D; --hair-2:#222A26; --teal:#6FB3B3; --teal-ink:#8CC6C6;
    --teal-wash:rgba(111,179,179,0.12); --teal-line:rgba(111,179,179,0.34);
    --caution:#D0975A; --caution-wash:rgba(208,151,90,0.12);
    --shadow:0 1px 2px rgba(0,0,0,0.30), 0 18px 48px -24px rgba(0,0,0,0.66);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: tabular-nums;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---- progress line, pinned to the very top edge ---- */
  .rail {
    position: fixed; inset: 0 0 auto 0; height: 2px;
    background: transparent; z-index: 40;
  }
  .rail__fill {
    height: 100%; width: 0%;
    background: var(--teal);
    transition: width 0.9s var(--ease);
    box-shadow: 0 0 0 0.5px var(--teal-line);
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 24px;
    padding: 26px clamp(20px, 6vw, 56px) 0;
    max-width: 940px; width: 100%; margin: 0 auto;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .brand__mark { width: 15px; height: 15px; display: block; color: var(--teal); }
  .clock {
    text-align: right; line-height: 1.25;
  }
  .clock__val {
    font-family: var(--serif);
    font-size: 19px; font-weight: 600; color: var(--ink);
    letter-spacing: 0.01em;
    font-feature-settings: "tnum" 1;
  }
  .clock__lab {
    font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--faint); margin-top: 3px;
  }

  /* ---- stage ---- */
  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 32px clamp(20px, 6vw, 56px) 40px;
  }
  .stage {
    width: 100%; max-width: 600px;
  }

  .step { animation: rise 0.5s var(--ease) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .kicker {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--muted); margin-bottom: 22px;
    letter-spacing: 0.02em;
  }
  .kicker__n {
    font-variant-numeric: tabular-nums;
    color: var(--faint); font-weight: 600; letter-spacing: 0.08em;
  }
  .kicker__n b { color: var(--ink); font-weight: 700; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 3px 10px 3px 8px; border-radius: 999px;
    border: 1px solid var(--hair); color: var(--muted);
    background: transparent;
  }
  .chip__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
  .chip--record { color: var(--teal-ink); border-color: var(--teal-line); background: var(--teal-wash); }
  .chip--entry  { color: var(--muted); }
  .chip--look   { color: var(--caution); border-color: var(--caution-wash); background: var(--caution-wash); }
  .chip--manual { color: var(--caution); border-color: var(--caution-wash); background: var(--caution-wash); }

  .prompt {
    font-family: var(--serif);
    font-size: clamp(30px, 5.4vw, 44px);
    line-height: 1.1; font-weight: 600;
    letter-spacing: -0.012em;
    text-wrap: balance;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted); font-size: 15px; margin: 14px 0 0; max-width: 46ch;
    line-height: 1.55;
  }

  /* value card for from-the-record fields */
  .value {
    margin-top: 30px;
    background: var(--raise);
    border: 1px solid var(--hair);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
  }
  .value::before {
    content: ""; position: absolute; left: 0; top: 16px; bottom: 16px;
    width: 2.5px; border-radius: 3px; background: var(--teal); opacity: 0.75;
  }
  .value--look::before { background: var(--caution); }
  .value--manual::before { background: var(--caution); }
  .value__text {
    font-family: var(--serif); font-size: 22px; line-height: 1.4; color: var(--ink);
    font-weight: 500;
  }
  .value__src {
    font-size: 12.5px; color: var(--muted); margin-top: 6px;
    display: flex; align-items: center; gap: 7px;
  }
  .value__src i { font-style: normal; color: var(--faint); }

  /* text inputs for worker-entry / needs-a-look edits */
  .field {
    margin-top: 30px;
    background: var(--raise);
    border: 1px solid var(--hair);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 6px 6px 6px 20px;
    display: flex; align-items: stretch;
  }
  .field--look { border-color: var(--caution-wash); }
  .field input, .field textarea {
    flex: 1; border: none; background: transparent; resize: none;
    font-family: var(--serif); font-size: 20px; line-height: 1.5; color: var(--ink);
    padding: 16px 0; outline: none; width: 100%;
    font-weight: 500;
  }
  .field textarea { padding-right: 14px; min-height: 116px; }
  .field ::placeholder { color: var(--faint); font-style: italic; }

  /* choices (safety / bool) */
  .choices { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .choice {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
    background: var(--raise); border: 1px solid var(--hair); border-radius: 12px;
    padding: 15px 22px; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease), transform 0.12s var(--ease);
  }
  .choice:hover { border-color: var(--muted); }
  .choice[aria-pressed="true"] { border-color: var(--caution); background: var(--caution-wash); color: var(--caution); }
  .choice:active { transform: translateY(1px); }

  /* action row */
  .actions {
    margin-top: 30px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .btn {
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    border-radius: 11px; padding: 13px 24px; border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 10px;
    transition: background 0.2s var(--ease), transform 0.12s var(--ease), opacity 0.2s;
  }
  .btn--go {
    background: var(--teal); color: #08211F; border-color: var(--teal);
  }
  .btn--go:hover { filter: brightness(1.03); }
  .btn--go:active { transform: translateY(1px); }
  .btn--ghost {
    background: transparent; color: var(--muted); border-color: var(--hair);
  }
  .btn--ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btn kbd {
    font-family: var(--sans); font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.22); border-radius: 5px; padding: 1px 6px;
    letter-spacing: 0.02em;
  }
  .btn--ghost kbd { background: var(--hair-2); color: var(--muted); }

  .hint {
    font-size: 12.5px; color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .hint kbd {
    font-family: var(--sans); font-weight: 700; font-size: 11px;
    border: 1px solid var(--hair); border-radius: 5px; padding: 1px 6px; color: var(--muted);
    background: var(--raise);
  }

  /* focus visibility */
  :focus-visible {
    outline: 2.5px solid var(--teal);
    outline-offset: 3px;
    border-radius: 12px;
  }
  .field:focus-within { border-color: var(--teal); box-shadow: var(--shadow), 0 0 0 3px var(--teal-wash); }

  /* opening + reveal cards share the intro layout */
  .intro__eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--teal-ink); font-weight: 700; margin-bottom: 20px;
  }
  .intro__lead {
    font-family: var(--serif); font-size: clamp(30px, 5.4vw, 46px); line-height: 1.12;
    font-weight: 600; letter-spacing: -0.012em; margin: 0; text-wrap: balance;
  }
  .intro__note { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 18px 0 0; max-width: 44ch; }

  /* reveal */
  .reveal { animation: rise 0.6s var(--ease) both; }
  .reveal__eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 26px;
  }
  .figure {
    display: flex; align-items: baseline; gap: 16px;
  }
  .figure__num {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(84px, 20vw, 168px); line-height: 0.86;
    letter-spacing: -0.03em; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .figure__unit {
    font-family: var(--serif); font-size: clamp(22px, 4vw, 32px);
    color: var(--teal-ink); font-weight: 600; line-height: 1.1;
  }
  .figure__unit span { display: block; color: var(--muted); font-size: 15px; font-family: var(--sans); font-weight: 500; margin-top: 4px; }
  .reveal__line {
    margin: 30px 0 0; font-size: 17px; line-height: 1.55; color: var(--ink); max-width: 42ch;
  }
  .reveal__line b { color: var(--teal-ink); font-weight: 700; }

  .breakdown {
    margin-top: 30px; border-top: 1px solid var(--hair); padding-top: 22px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 460px;
  }
  .bd__n { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1; }
  .bd__l { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .bd--record .bd__n { color: var(--teal-ink); }
  .bd__l b { color: var(--ink); font-weight: 600; }

  .reveal__foot {
    margin-top: 30px; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .reveal__foot .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }

  .textlink {
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--teal-ink);
    background: none; border: none; cursor: pointer; padding: 0;
    border-bottom: 1px solid var(--teal-line);
  }
  .textlink:hover { border-bottom-color: var(--teal-ink); }

  /* footer status */
  footer {
    padding: 0 clamp(20px, 6vw, 56px) 24px;
    max-width: 940px; width: 100%; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    font-size: 12px; color: var(--faint);
  }
  .ttrack {
    display: flex; align-items: center; gap: 5px;
  }
  .tick { width: 14px; height: 3px; border-radius: 2px; background: var(--hair); transition: background 0.5s var(--ease); }
  .tick.on { background: var(--teal); }
  .tick.look { background: var(--caution); opacity: 0.55; }

  @media (max-width: 560px) {
    .breakdown { grid-template-columns: 1fr 1fr; }
    header, footer { padding-left: 20px; padding-right: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    .step, .reveal { animation: none; }
  }
</style>

<div class="rail" aria-hidden="true"><div class="rail__fill" id="rail"></div></div>

<header>
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3c0 3-2 5-5 5 3 0 5 2 5 5 0-3 2-5 5-5-3 0-5-2-5-5Z" fill="currentColor" opacity="0.9"/>
      <path d="M12 13v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Fostr Chronicle · Case Ledger
  </div>
  <div class="clock">
    <div class="clock__val" id="clock">0:00</div>
    <div class="clock__lab">returned so far</div>
  </div>
</header>

<main>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>

<footer>
  <div id="foot-note">Contact note · schema check-in-v1</div>
  <div class="track" id="track" aria-hidden="true"></div>
</footer>

<script src="shared/data.js"></script>
<script>
(function () {
  "use strict";
  const L = window.LEDGER;
  const stage = document.getElementById("stage");
  const rail = document.getElementById("rail");
  const clockEl = document.getElementById("clock");
  const trackEl = document.getElementById("track");
  const footNote = document.getElementById("foot-note");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- per-field display content, tied to the real schema in data.js ---
  const CHILD = "Priya";
  const content = {
    contact_date:         { prompt: "When did you see " + CHILD + "?",       value: "Thursday, July 24, 2026",                      note: "scheduled monthly visit" },
    contact_type:         { prompt: "How did the visit happen?",             value: "Home visit — in person",                       note: "same as the last six visits" },
    participants:         { prompt: "Who was in the room?",                  placeholder: "e.g. " + CHILD + ", foster parent Ms. Adeyemi…" },
    child_seen_privately: { prompt: "Did you see " + CHILD + " on her own?",  value: "Yes — 18 minutes, one-on-one",                 note: "required each visit" },
    placement_stability:  { prompt: "How is the placement holding?",         value: "Stable — no change since June",                note: "placement opened Mar 2026" },
    safety_concerns:      { prompt: "Any safety concerns today?",            manual: true },
    wellbeing:            { prompt: "How is she doing?",                     draft: "Settled and cheerful; foster parent reports steady sleep and appetite." },
    education:            { prompt: "How is school going?",                  value: "Grade 1 · Lincoln Elementary — attendance 96%", note: "pulled from education record" },
    services:            { prompt: "What support is in place?",             value: "Weekly play therapy · Medicaid active",        note: "from the services record" },
    next_visit_date:      { prompt: "When will you go back?",                placeholder: "e.g. August 21, 2026" },
    narrative:            { prompt: "The narrative.",                         draft: CHILD + " greeted me at the door and showed me her reading log. The home was calm and well-kept. She spoke openly about school and her weekend. No concerns observed; follow-up on the therapy referral next month." }
  };

  // --- build the run of steps, and pre-compute the "returned" seconds ---
  // Time is returned ONLY by fields already on the record (source: system) —
  // those are the ones you didn't retype. We scale them so the tally lands
  // exactly on the canonical 11:00 (baselineMinutes - chronicleMinutes).
  const fields = L.fields;
  const systemFields = fields.filter(f => f.source === "system");
  const totalManual = systemFields.reduce((s, f) => s + f.manualSec, 0);
  const targetSec = L.model.perNoteSavedMin * 60; // 660
  const scale = targetSec / totalManual;
  let acc = 0, seen = 0;
  const savedFor = {};
  systemFields.forEach((f, i) => {
    seen++;
    if (seen === systemFields.length) { savedFor[f.key] = targetSec - acc; }
    else { const v = Math.round(f.manualSec * scale); savedFor[f.key] = v; acc += v; }
  });

  const srcMeta = L.sourceMeta;
  let idx = -1;            // -1 = opening, 0..n-1 = fields, n = reveal
  let savedSec = 0;        // running returned-time tally
  const total = fields.length;

  // ---- footer track ----
  fields.forEach(f => {
    const t = document.createElement("span");
    t.className = "tick";
    t.dataset.src = f.source;
    trackEl.appendChild(t);
  });
  const ticks = [...trackEl.children];

  function fmtClock(sec) {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function setClock(sec) { clockEl.textContent = fmtClock(sec); }

  function animateClock(from, to) {
    if (reduce) { setClock(to); return; }
    const dur = 620, t0 = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      setClock(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function updateRail() {
    const done = Math.max(0, idx);
    const pct = idx >= total ? 100 : (done / total) * 100;
    rail.style.width = pct + "%";
  }

  function markTick(i, field) {
    if (i < 0 || i >= ticks.length) return;
    ticks[i].classList.add("on");
    if (field.source === "needs_look") ticks[i].classList.add("look");
  }

  // ---- renderers ----
  function chip(source, manual) {
    if (manual) return '<span class="chip chip--manual"><span class="chip__dot"></span>Manual only · safety</span>';
    const map = {
      system:    ["chip--record", srcMeta.system.label],
      dictated:  ["chip--entry",  srcMeta.dictated.label],
      needs_look:["chip--look",   srcMeta.needs_look.label]
    };
    const [cls, label] = map[source] || ["chip--entry", "Field"];
    return '<span class="chip ' + cls + '"><span class="chip__dot"></span>' + label + '</span>';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

  function renderOpening() {
    footNote.textContent = "Contact note · " + CHILD + " Desai · schema check-in-v1";
    stage.innerHTML =
      '<div class="step">' +
        '<div class="intro__eyebrow">One note · ' + total + ' fields</div>' +
        '<h1 class="intro__lead">Most of this note is already here. You just confirm what is known and add what is new.</h1>' +
        '<p class="intro__note">Six of eleven fields came straight from ' + CHILD + '’s record. We’ll step through them one at a time — a quiet moment each.</p>' +
        '<div class="actions">' +
          '<button class="btn btn--go" id="primary" type="button">Begin <kbd>Enter</kbd></button>' +
          '<span class="hint">or press <kbd>&darr;</kbd> to move through</span>' +
        '</div>' +
      '</div>';
    focusPrimary();
  }

  function renderField() {
    const f = fields[idx];
    const c = content[f.key] || {};
    const n = String(idx + 1).padStart(2, "0");
    let body = "";
    let advanceLabel = "Confirm";
    let advanceKbd = "Enter";
    let sub = "";

    if (f.source === "system") {
      // pre-filled from the record — confirm only
      body =
        '<div class="value">' +
          '<div class="value__text">' + esc(c.value) + '</div>' +
          '<div class="value__src"><i>' + srcMeta.system.note + '</i> · ' + esc(c.note || "") + '</div>' +
        '</div>';
      advanceLabel = "Confirm";
    } else if (c.manual) {
      // high-risk safety — manual only, no inference, no accent confirm until answered
      sub = "Safety is never inferred. Please set this yourself.";
      body =
        '<div class="choices" role="group" aria-label="Safety concerns">' +
          '<button class="choice" type="button" data-safe="none" aria-pressed="false">No concerns</button>' +
          '<button class="choice" type="button" data-safe="flag" aria-pressed="false">Concern to flag</button>' +
        '</div>';
      advanceLabel = "Record & continue";
    } else if (f.source === "needs_look") {
      // low-confidence draft — glance, keep or edit
      sub = "We drafted this from the visit. Give it a glance — keep it or edit.";
      const tall = f.key === "narrative";
      body =
        '<div class="field field--look">' +
          (tall
            ? '<textarea id="entry" aria-label="' + esc(f.label) + '">' + esc(c.draft) + '</textarea>'
            : '<input id="entry" type="text" aria-label="' + esc(f.label) + '" value="' + esc(c.draft) + '">') +
        '</div>';
      advanceLabel = "Looks right";
    } else {
      // worker entry — type what's new
      sub = "New this visit — a short line is plenty.";
      const tall = f.key === "narrative";
      body =
        '<div class="field">' +
          (tall
            ? '<textarea id="entry" aria-label="' + esc(f.label) + '" placeholder="' + esc(c.placeholder || "") + '"></textarea>'
            : '<input id="entry" type="text" aria-label="' + esc(f.label) + '" placeholder="' + esc(c.placeholder || "") + '">') +
        '</div>';
      advanceLabel = "Add & continue";
    }

    const gained = f.source === "system"
      ? '<span class="hint">+' + fmtClock(savedFor[f.key]) + ' back — not retyped</span>'
      : '<span class="hint">nothing to retype here</span>';

    stage.innerHTML =
      '<div class="step">' +
        '<div class="kicker">' +
          '<span class="kicker__n"><b>' + n + '</b> / ' + total + '</span>' +
          chip(f.source, c.manual) +
        '</div>' +
        '<h1 class="prompt">' + esc(c.prompt || f.label) + '</h1>' +
        (sub ? '<p class="sub">' + sub + '</p>' : '') +
        body +
        '<div class="actions">' +
          '<button class="btn btn--go" id="primary" type="button"' + (c.manual ? ' disabled style="opacity:.45;cursor:not-allowed"' : '') + '>' +
            esc(advanceLabel) + ' <kbd>' + advanceKbd + '</kbd></button>' +
          (idx > 0 ? '<button class="btn btn--ghost" id="back" type="button">Back <kbd>&uarr;</kbd></button>' : '') +
          gained +
        '</div>' +
      '</div>';

    // wire safety choices
    if (c.manual) {
      const primary = document.getElementById("primary");
      stage.querySelectorAll("[data-safe]").forEach(btn => {
        btn.addEventListener("click", () => {
          stage.querySelectorAll("[data-safe]").forEach(b => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          primary.disabled = false;
          primary.style.opacity = ""; primary.style.cursor = "";
          primary.focus();
        });
      });
    }

    const back = document.getElementById("back");
    if (back) back.addEventListener("click", goBack);

    focusPrimary(f);
  }

  function focusPrimary(f) {
    // For entry fields, focus the text so the flow is genuinely keyboard-first;
    // otherwise focus the confirm button.
    requestAnimationFrame(() => {
      const entry = document.getElementById("entry");
      const primary = document.getElementById("primary");
      if (entry && f && (f.source === "dictated" || f.source === "needs_look") && !(content[f.key] && content[f.key].manual)) {
        entry.focus();
        const v = entry.value; entry.value = ""; entry.value = v; // caret to end
      } else if (primary && !primary.disabled) {
        primary.focus();
      }
    });
  }

  function renderReveal() {
    rail.style.width = "100%";
    footNote.textContent = "Filed to records · nothing retyped";
    const reused = Math.round(L.sources.system);      // 6
    const captured = Math.round(L.sources.dictated);  // 3
    const confirmed = Math.round(L.sources.needs_look);// 1  (rounded) — we hold the honest 2 from our run
    const lookedAt = fields.filter(f => f.source === "needs_look").length; // 2

    stage.innerHTML =
      '<div class="reveal">' +
        '<div class="reveal__eyebrow">Note filed · ' + CHILD + ' Desai</div>' +
        '<div class="figure">' +
          '<div class="figure__num" id="bignum">0</div>' +
          '<div class="figure__unit">minutes<br>back<span>on this one note</span></div>' +
        '</div>' +
        '<p class="reveal__line">Six of eleven fields were already on the record — you confirmed them instead of retyping. <b>That is where the time came back.</b></p>' +
        '<div class="breakdown">' +
          '<div class="bd bd--record"><div class="bd__n">' + systemFields.length + '</div><div class="bd__l"><b>from the record</b><br>confirmed, not retyped</div></div>' +
          '<div class="bd"><div class="bd__n">' + fields.filter(f=>f.source==="dictated").length + '</div><div class="bd__l"><b>you captured</b><br>new this visit</div></div>' +
          '<div class="bd"><div class="bd__n">' + lookedAt + '</div><div class="bd__l"><b>you confirmed</b><br>drafted, then checked</div></div>' +
        '</div>' +
        '<div class="reveal__foot">' +
          '<span>16 min the old way</span><span class="dot"></span>' +
          '<span>5 min in Chronicle</span><span class="dot"></span>' +
          '<span>' + L.month.minutesSaved + ' min back across ' + L.month.filed + ' notes in ' + L.month.label + '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn--go" id="primary" type="button">Next note <kbd>Enter</kbd></button>' +
          '<button class="textlink" id="restart" type="button">Step through again</button>' +
        '</div>' +
      '</div>';

    document.getElementById("restart").addEventListener("click", restart);
    document.getElementById("primary").addEventListener("click", restart);
    document.getElementById("primary").focus();

    animateBigNumber(L.model.perNoteSavedMin);
  }

  function animateBigNumber(target) {
    const el = document.getElementById("bignum");
    if (reduce) { el.textContent = target; return; }
    const dur = 1400, t0 = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(target * e);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ---- advance / back ----
  function advance() {
    if (idx >= 0 && idx < total) {
      const f = fields[idx];
      // guard: safety must be answered
      if (content[f.key] && content[f.key].manual) {
        const chosen = stage.querySelector('[data-safe][aria-pressed="true"]');
        if (!chosen) { const p = document.getElementById("primary"); if (p) p.disabled = true; return; }
      }
      markTick(idx, f);
      if (f.source === "system") {
        const from = savedSec;
        savedSec += savedFor[f.key];
        animateClock(from, savedSec);
      }
    }
    idx++;
    updateRail();
    if (idx >= total) { renderReveal(); }
    else { renderField(); }
  }

  function goBack() {
    if (idx <= 0) return;
    // roll the clock back if we're stepping off a system field we'd credited
    idx--;
    const f = fields[idx];
    if (f.source === "system") {
      const from = savedSec;
      savedSec = Math.max(0, savedSec - savedFor[f.key]);
      animateClock(from, savedSec);
    }
    ticks[idx].classList.remove("on", "look");
    updateRail();
    renderField();
  }

  function restart() {
    idx = -1; savedSec = 0;
    setClock(0);
    ticks.forEach(t => t.classList.remove("on", "look"));
    updateRail();
    renderOpening();
  }

  // ---- keyboard: Enter / ArrowDown advance, ArrowUp back ----
  document.addEventListener("keydown", (e) => {
    const inField = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
    const isTextarea = e.target && e.target.tagName === "TEXTAREA";

    if (e.key === "Enter") {
      if (isTextarea && e.shiftKey) return;         // allow newlines in narrative
      if (inField && e.isComposing) return;
      e.preventDefault();
      const primary = document.getElementById("primary");
      if (primary && primary.disabled) return;
      advance();
      return;
    }
    if (e.key === "ArrowDown" && !inField) { e.preventDefault(); const p=document.getElementById("primary"); if(!(p&&p.disabled)) advance(); }
    if (e.key === "ArrowUp" && !inField)   { e.preventDefault(); goBack(); }
  });

  // ---- go ----
  setClock(0);
  updateRail();
  renderOpening();
})();
</script>

</body>
</html>
