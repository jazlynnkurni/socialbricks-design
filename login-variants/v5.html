<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fostr — Sign in</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---- v5 "Living Mark": layout + motion only. Base comes from tokens.css ---- */
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--teal-tint) 0%, transparent 55%),
      var(--canvas);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 30px 30px 26px;
    box-shadow:
      0 1px 2px rgba(31, 39, 37, 0.04),
      0 18px 46px -28px rgba(31, 39, 37, 0.28);
  }

  /* ---- The living mark ---- */
  .mark {
    display: block;
    width: 128px;
    height: 128px;
    margin: 2px auto 14px;
    /* the canvas paints inside this box; sits alone as the flourish */
    touch-action: none;
  }
  .mark canvas { display: block; width: 100%; height: 100%; }

  .brand {
    text-align: center;
    margin: 0 0 4px;
  }
  .brand .word {
    font-size: 1.72rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }
  .lede {
    text-align: center;
    font-size: 0.92rem;
    color: var(--ink-2);
    margin: 8px 0 22px;
  }

  form { display: grid; gap: 15px; }

  .pw-wrap { position: relative; }
  .pw-wrap > input { padding-right: 62px; }
  .pw-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    height: 36px;
    min-width: 52px;
    padding: 0 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--teal-deep);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .pw-toggle:hover { background: var(--teal-tint); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: -2px;
  }
  .keep {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 0.9rem;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
    min-height: var(--tap);
  }
  .keep input {
    width: 20px;
    height: 20px;
    accent-color: var(--teal);
    cursor: pointer;
  }
  .row .link { font-size: 0.9rem; }

  .actions { display: grid; gap: 11px; margin-top: 4px; }

  .btn-primary { position: relative; }
  .btn-primary[aria-busy="true"] { color: transparent; pointer-events: none; }
  .btn-primary[aria-busy="true"]::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .btn-primary .status-text {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 600;
  }
  .btn-primary[aria-busy="true"] .status-text {
    display: flex;
    color: #fff;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--ink-3);
    font-size: 0.78rem;
    margin: 2px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .sso-mark { width: 18px; height: 18px; color: var(--teal-deep); }

  .support {
    text-align: center;
    font-size: 0.82rem;
    color: var(--ink-3);
    margin: 18px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary[aria-busy="true"]::after { animation: none; }
  }

  @media (max-width: 380px) {
    .card { padding: 24px 20px 22px; }
  }
</style>
</head>
<body>
  <main class="card">
    <!-- Living mark: canvas painted by JS; SVG fallback static sprout underneath -->
    <div class="mark" id="mark" aria-hidden="true">
      <canvas id="sprout" width="256" height="256"></canvas>
    </div>

    <div class="brand"><span class="word">Fostr</span></div>
    <p class="lede">Casework that keeps up with the field.</p>

    <form id="form" novalidate autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="Your agency username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Your password" required>
          <button type="button" class="pw-toggle" id="pwToggle"
                  aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="row">
        <label class="keep">
          <input type="checkbox" id="keep" name="keep">
          Keep me signed in
        </label>
        <a class="link" href="#" id="forgot">Forgot password?</a>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="signin">
          Sign in
          <span class="status-text" aria-hidden="true">Signing in…</span>
        </button>

        <div class="divider">or</div>

        <button type="button" class="btn-ghost" id="sso">
          <svg class="sso-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l7 3v5c0 4.2-2.8 7.6-7 9-4.2-1.4-7-4.8-7-9V6l7-3z"
                  stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sign in with agency SSO
        </button>
      </div>
    </form>

    <p class="support muted">Trouble signing in? Ask your agency admin.</p>
  </main>

  <div aria-live="polite" class="muted" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);" id="live"></div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Living mark — a teal sprout that breathes, sways, and leans gently
   * toward the pointer. rAF-driven, capped, freezes under reduced motion.
   * ------------------------------------------------------------------ */
  var canvas = document.getElementById("sprout");
  var mark = document.getElementById("mark");
  var ctx = canvas.getContext("2d");

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var SIZE = 128; // css px, square

  function resize() {
    canvas.width = SIZE * DPR;
    canvas.height = SIZE * DPR;
    canvas.style.width = SIZE + "px";
    canvas.style.height = SIZE + "px";
  }
  resize();

  // Pointer influence, smoothed. -1..1 across the mark.
  var target = { x: 0, y: 0 };
  var pointer = { x: 0, y: 0 };
  var hover = 0;      // 0..1 ease of engagement
  var hoverTarget = 0;

  function onMove(e) {
    var r = mark.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    target.x = Math.max(-1, Math.min(1, (px - 0.5) * 2));
    target.y = Math.max(-1, Math.min(1, (py - 0.5) * 2));
    hoverTarget = 1;
  }
  function onLeave() { hoverTarget = 0; target.x = 0; target.y = 0; }

  // Listen on the card so the sprout responds to nearby movement, calmly.
  var card = document.querySelector(".card");
  card.addEventListener("pointermove", onMove, { passive: true });
  card.addEventListener("pointerleave", onLeave, { passive: true });

  // Palette (kept in sync with tokens.css spirit)
  var TEAL = "#3d8b88";
  var TEAL_DEEP = "#2a6a68";
  var TEAL_SOFT = "#7fb4b1";
  var STEM = "#4f9a92";

  // A leaf drawn as a lens shape, with a center vein.
  function leaf(len, wid, curl, fill) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(wid, -len * 0.42, curl * 0.18, -len);
    ctx.quadraticCurveTo(-wid * 0.28, -len * 0.5, 0, 0);
    ctx.fillStyle = fill;
    ctx.fill();
    // vein
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(wid * 0.18, -len * 0.5, curl * 0.16, -len * 0.92);
    ctx.strokeStyle = "rgba(255,255,255,0.30)";
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  var t0 = performance.now();

  // Frame cap ~40fps — smooth but light on iPad battery.
  var FRAME_MS = 1000 / 40;
  var lastFrame = 0;
  var rafId = null;

  function draw(now) {
    if (now - lastFrame < FRAME_MS) { rafId = requestAnimationFrame(draw); return; }
    lastFrame = now;

    var t = (now - t0) / 1000;

    // Ease pointer + hover toward targets (organic lag).
    pointer.x += (target.x - pointer.x) * 0.06;
    pointer.y += (target.y - pointer.y) * 0.06;
    hover += (hoverTarget - hover) * 0.05;

    // Breathing: slow scale + sway.
    var breathe = Math.sin(t * 0.9) * 0.5 + 0.5;      // 0..1
    var sway = Math.sin(t * 0.6) * 0.5 + Math.sin(t * 0.23) * 0.5;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);

    var cx = SIZE / 2;
    var groundY = SIZE * 0.80;

    /* --- roots: faint shimmering lines beneath the soil line --- */
    ctx.save();
    ctx.translate(cx, groundY);
    var rootPulse = 0.10 + 0.06 * breathe + 0.10 * hover;
    for (var i = -2; i <= 2; i++) {
      var a = i * 0.42;
      var glow = 0.5 + 0.5 * Math.sin(t * 1.3 + i);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(
        Math.sin(a) * 10, 9,
        Math.sin(a) * 20 + pointer.x * 3, 20 + Math.abs(Math.cos(a)) * 6
      );
      ctx.strokeStyle = "rgba(61,139,136," + (rootPulse * (0.5 + 0.5 * glow)).toFixed(3) + ")";
      ctx.lineWidth = 1.3;
      ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.restore();

    // soft soil line
    ctx.beginPath();
    ctx.moveTo(cx - 26, groundY);
    ctx.lineTo(cx + 26, groundY);
    ctx.strokeStyle = "rgba(61,139,136,0.16)";
    ctx.lineWidth = 1.4;
    ctx.lineCap = "round";
    ctx.stroke();

    /* --- stem + leaves, leaning gently toward pointer --- */
    ctx.save();
    ctx.translate(cx, groundY);

    // overall lean: base sway + pointer influence (subtle)
    var lean = sway * 0.03 + pointer.x * 0.14 * (0.35 + hover);
    ctx.rotate(lean);

    var stemH = SIZE * 0.42 * (0.97 + 0.03 * breathe);

    // stem
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(pointer.x * 4, -stemH * 0.5, pointer.x * 5, -stemH);
    ctx.strokeStyle = STEM;
    ctx.lineWidth = 3.4;
    ctx.lineCap = "round";
    ctx.stroke();

    // move to stem tip for the leaf pair
    ctx.translate(pointer.x * 5, -stemH);

    var open = 0.30 + 0.05 * breathe + 0.05 * hover; // radians the leaves splay

    // left leaf
    ctx.save();
    ctx.rotate(-Math.PI / 2 - open + sway * 0.02);
    leaf(SIZE * 0.30, SIZE * 0.115, -1, TEAL_DEEP);
    ctx.restore();

    // right leaf (a touch larger, catches the "light")
    ctx.save();
    ctx.rotate(-Math.PI / 2 + open - sway * 0.02);
    leaf(SIZE * 0.33, SIZE * 0.125, 1, TEAL);
    ctx.restore();

    // a young center sprout tip
    ctx.save();
    ctx.rotate(sway * 0.03 + pointer.x * 0.05);
    leaf(SIZE * 0.15, SIZE * 0.055, 1, TEAL_SOFT);
    ctx.restore();

    /* --- drifting light: a soft highlight that slides with breathing --- */
    var lightY = -SIZE * 0.10 - breathe * SIZE * 0.06;
    var g = ctx.createRadialGradient(pointer.x * 6, lightY, 0, pointer.x * 6, lightY, SIZE * 0.24);
    g.addColorStop(0, "rgba(255,255,255," + (0.10 + 0.10 * breathe).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pointer.x * 6, lightY, SIZE * 0.24, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    rafId = requestAnimationFrame(draw);
  }

  /* Static sprout for reduced-motion (or when animation is paused). */
  function drawStatic() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);
    var cx = SIZE / 2, groundY = SIZE * 0.80;

    // soil
    ctx.beginPath();
    ctx.moveTo(cx - 26, groundY); ctx.lineTo(cx + 26, groundY);
    ctx.strokeStyle = "rgba(61,139,136,0.16)"; ctx.lineWidth = 1.4; ctx.lineCap = "round"; ctx.stroke();

    // roots (still)
    ctx.save();
    ctx.translate(cx, groundY);
    for (var i = -2; i <= 2; i++) {
      var a = i * 0.42;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.sin(a) * 10, 9, Math.sin(a) * 20, 20 + Math.abs(Math.cos(a)) * 6);
      ctx.strokeStyle = "rgba(61,139,136,0.16)"; ctx.lineWidth = 1.3; ctx.lineCap = "round"; ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(cx, groundY);
    var stemH = SIZE * 0.42;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(0, -stemH * 0.5, 0, -stemH);
    ctx.strokeStyle = STEM; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.stroke();
    ctx.translate(0, -stemH);
    var open = 0.33;
    ctx.save(); ctx.rotate(-Math.PI / 2 - open); leaf(SIZE * 0.30, SIZE * 0.115, -1, TEAL_DEEP); ctx.restore();
    ctx.save(); ctx.rotate(-Math.PI / 2 + open); leaf(SIZE * 0.33, SIZE * 0.125, 1, TEAL); ctx.restore();
    ctx.save(); leaf(SIZE * 0.15, SIZE * 0.055, 1, TEAL_SOFT); ctx.restore();
    ctx.restore();
  }

  function start() {
    if (reduce.matches) { drawStatic(); return; }
    if (!rafId) { lastFrame = 0; rafId = requestAnimationFrame(draw); }
  }
  function stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

  // Pause when the tab/card isn't visible — battery friendly.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else start();
  });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) start(); else stop();
      });
    }, { threshold: 0.05 }).observe(mark);
  }

  reduce.addEventListener ? reduce.addEventListener("change", function () {
    stop(); start();
  }) : reduce.addListener(function () { stop(); start(); });

  start();

  /* ------------------------------------------------------------------ *
   * Form behavior — visual prototype only, no network.
   * ------------------------------------------------------------------ */
  var pw = document.getElementById("password");
  var pwToggle = document.getElementById("pwToggle");
  pwToggle.addEventListener("click", function () {
    var showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    pwToggle.textContent = showing ? "Show" : "Hide";
    pwToggle.setAttribute("aria-pressed", String(!showing));
    pwToggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    pw.focus({ preventScroll: true });
  });

  var form = document.getElementById("form");
  var signin = document.getElementById("signin");
  var live = document.getElementById("live");
  var busy = false;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    busy = true;
    signin.setAttribute("aria-busy", "true");
    signin.disabled = true;
    live.textContent = "Signing in…";
    // Brief visual "Signing in…" state, then settle. No server.
    setTimeout(function () {
      busy = false;
      signin.removeAttribute("aria-busy");
      signin.disabled = false;
      live.textContent = "Signed in.";
    }, 1600);
  });

  document.getElementById("sso").addEventListener("click", function () {
    live.textContent = "Redirecting to agency SSO…";
  });
  document.getElementById("forgot").addEventListener("click", function (e) {
    e.preventDefault();
    live.textContent = "Password help is handled by your agency admin.";
  });
})();
</script>
</body>
</html>
