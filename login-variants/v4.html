<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Fostr</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* v4 — Agency-first / future auth. Only layout + motion here. */
  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 452px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 36px 32px;
    box-shadow: 0 1px 2px rgba(31,39,37,.04), 0 18px 44px rgba(31,39,37,.07);
  }

  /* brand */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand svg { display: block; }
  .brand .word { font-size: 1.32rem; font-weight: 700; letter-spacing: -.015em; color: var(--ink); }

  .lede { margin: 0 0 4px; font-size: 1.34rem; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .sub { margin: 0 0 26px; font-size: .95rem; color: var(--ink-2); }

  /* primary agency button — larger than a normal btn */
  .btn-agency {
    width: 100%;
    min-height: 60px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    background: var(--teal);
    color: #fff;
    font-weight: 600;
    font-size: 1.04rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 20px;
    transition: background .18s ease, transform .06s ease, box-shadow .18s ease;
    box-shadow: 0 6px 16px rgba(61,139,136,.24);
  }
  .btn-agency:hover { background: var(--teal-deep); }
  .btn-agency:active { transform: translateY(1px); }
  .btn-agency[aria-busy="true"] { pointer-events: none; opacity: .82; }
  .btn-agency .spin { width: 18px; height: 18px; display: none; }
  .btn-agency[aria-busy="true"] .spin { display: inline-block; }
  .btn-agency[aria-busy="true"] .glyph { display: none; }

  /* passkey affordance — quiet */
  .passkey {
    margin-top: 12px;
    width: 100%;
    min-height: var(--tap);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--ink-2);
    font-weight: 600;
    font-size: .92rem;
    transition: border-color .18s ease, background .18s ease, color .18s ease;
  }
  .passkey:hover { border-color: color-mix(in srgb, var(--teal) 45%, var(--line)); background: var(--teal-tint); color: var(--ink); }
  .passkey svg { color: var(--teal); flex: none; }

  /* reveal trigger */
  .reveal-row { margin-top: 22px; text-align: center; }
  .reveal-btn {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-2);
    font-weight: 600;
    font-size: .9rem;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 8px;
    transition: color .18s ease, background .18s ease;
  }
  .reveal-btn:hover { color: var(--ink); background: var(--canvas); }
  .reveal-btn .chev { transition: transform .28s ease; }
  .reveal-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* the in-place expanding panel */
  .drawer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .34s ease;
  }
  .drawer[data-open="true"] { grid-template-rows: 1fr; }
  .drawer > .drawer-inner { overflow: hidden; }
  .drawer-body {
    padding-top: 22px;
    margin-top: 20px;
    border-top: 1px solid var(--line);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .3s ease .06s, transform .3s ease .06s;
  }
  .drawer[data-open="true"] .drawer-body { opacity: 1; transform: none; }

  .field + .field { margin-top: 16px; }

  /* password field w/ show-hide */
  .pw-wrap { position: relative; }
  .pw-wrap > input { padding-right: 62px; }
  .pw-toggle {
    position: absolute;
    top: 0; right: 0;
    height: var(--tap);
    padding: 0 14px;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--teal-deep);
    font-weight: 600;
    font-size: .82rem;
  }
  .pw-toggle:hover { text-decoration: underline; }

  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .keep { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: .9rem; color: var(--ink-2); user-select: none; }
  .keep input { width: 18px; height: 18px; accent-color: var(--teal); cursor: pointer; }

  .btn-secondary-signin { margin-top: 20px; }
  .btn-secondary-signin .spin { width: 17px; height: 17px; display: none; vertical-align: -3px; }
  .btn-secondary-signin[aria-busy="true"] .spin { display: inline-block; }
  .btn-secondary-signin[aria-busy="true"] { pointer-events: none; opacity: .82; }
  .btn-secondary-signin[aria-busy="true"] .label { opacity: .6; }

  /* support line */
  .support { margin-top: 26px; text-align: center; font-size: .86rem; color: var(--ink-3); }

  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 460px) {
    .card { padding: 30px 22px 26px; border-radius: 0; border-left: none; border-right: none; min-height: 100vh; }
    .stage { padding: 0; place-items: stretch; }
  }

  @media (prefers-reduced-motion: reduce) {
    .drawer { transition: none; }
    .drawer-body { transition: none; }
    .reveal-btn .chev { transition: none; }
    .btn-agency, .passkey, .reveal-btn { transition: none; }
    .spin { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="lede">
      <div class="brand">
        <!-- Fostr sprout mark: two leaves over an o-stem -->
        <svg class="brandmark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M13 24V11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M13 12.5C13 9 10.6 6.2 6.5 6C6.3 10 8.7 12.6 13 12.9Z" fill="currentColor"/>
          <path d="M13 11C13 7.2 15.6 4.4 20 4.2C20.2 8.5 17.6 11.2 13 11.4Z" fill="currentColor" opacity=".72"/>
        </svg>
        <span class="word">Fostr</span>
      </div>

      <h1 class="lede" id="lede">Sign in</h1>
      <p class="sub">Use your agency account. One tap gets you to your caseload.</p>

      <!-- PRIMARY: agency SSO -->
      <button class="btn-agency" id="agencyBtn" type="button">
        <svg class="glyph" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 17V8.2L10 3l7 5.2V17" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8 17v-4.5h4V17" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <svg class="spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
          <path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="agency-label">Continue with your agency</span>
      </button>

      <!-- QUIET: passkey -->
      <button class="passkey" id="passkeyBtn" type="button">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7.5 8.5a2.5 2.5 0 1 1 4.4 1.6M10 12v4M8 14h4M6.5 12.5c-1.4 1-2.2 2.6-2.4 4.5M13.5 12.2c1.3 1 2.1 2.7 2.3 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="passkey-label">Use a passkey on this device</span>
      </button>

      <!-- REVEAL trigger -->
      <div class="reveal-row">
        <button class="reveal-btn" id="revealBtn" type="button" aria-expanded="false" aria-controls="otherWays">
          <span>Sign in another way</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- The expanding drawer: username + password -->
      <div class="drawer" id="otherWays" data-open="false">
        <div class="drawer-inner">
          <div class="drawer-body">
            <form id="pwForm" novalidate>
              <div class="field">
                <label for="user">Username</label>
                <input id="user" name="user" type="text" autocomplete="username" inputmode="text" placeholder="j.rivera" spellcheck="false">
              </div>

              <div class="field">
                <label for="pw">Password</label>
                <div class="pw-wrap">
                  <input id="pw" name="pw" type="password" autocomplete="current-password" placeholder="Your password">
                  <button class="pw-toggle" id="pwToggle" type="button" aria-pressed="false" aria-controls="pw">Show</button>
                </div>
              </div>

              <div class="row-between">
                <label class="keep">
                  <input type="checkbox" id="keep" name="keep">
                  <span>Keep me signed in</span>
                </label>
                <a class="link" href="#" id="forgot">Forgot password?</a>
              </div>

              <button class="btn-primary btn-secondary-signin" id="signinBtn" type="submit">
                <svg class="spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
                  <path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="label">Sign in</span>
              </button>
            </form>
          </div>
        </div>
      </div>

      <p class="support">Trouble signing in? Ask your agency admin.</p>
    </section>
  </main>

  <script>
    (function () {
      // reveal drawer
      var revealBtn = document.getElementById('revealBtn');
      var drawer = document.getElementById('otherWays');
      revealBtn.addEventListener('click', function () {
        var open = drawer.getAttribute('data-open') === 'true';
        drawer.setAttribute('data-open', String(!open));
        revealBtn.setAttribute('aria-expanded', String(!open));
        if (!open) {
          // focus first field once the drawer is opening
          setTimeout(function () { document.getElementById('user').focus(); }, 60);
        }
      });

      // show / hide password
      var pw = document.getElementById('pw');
      var pwToggle = document.getElementById('pwToggle');
      pwToggle.addEventListener('click', function () {
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        pwToggle.textContent = showing ? 'Show' : 'Hide';
        pwToggle.setAttribute('aria-pressed', String(!showing));
        pw.focus();
      });

      // brief "Signing in…" state helper
      function busy(btn, labelSel, busyText) {
        btn.setAttribute('aria-busy', 'true');
        var label = btn.querySelector(labelSel);
        var prev = label ? label.textContent : '';
        if (label && busyText) label.textContent = busyText;
        setTimeout(function () {
          btn.removeAttribute('aria-busy');
          if (label && busyText) label.textContent = prev;
        }, 2200);
      }

      document.getElementById('agencyBtn').addEventListener('click', function () {
        busy(this, '.agency-label', 'Signing in…');
      });
      document.getElementById('passkeyBtn').addEventListener('click', function () {
        busy(this, '.passkey-label', 'Checking passkey…');
      });
      document.getElementById('pwForm').addEventListener('submit', function (e) {
        e.preventDefault();
        busy(document.getElementById('signinBtn'), '.label', 'Signing in…');
      });
      document.getElementById('forgot').addEventListener('click', function (e) { e.preventDefault(); });
    })();
  </script>
</body>
</html>
