<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fostr Fieldbook — Clean Document</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ============================================================
     CLEAN DOCUMENT — the whole Fieldbook reads as one editorial
     page. No cards. Whitespace is the hero. Two views share the
     same single sheet: the caseload LIST and the open CASE.
     Only layout CSS here; visual language lives in tokens.css.
     ============================================================ */
  html, body { height: 100%; }

  .app { display: grid; grid-template-columns: 68px 1fr; min-height: 100vh; }

  /* ---- slim left nav rail ---- */
  .rail { position: sticky; top: 0; align-self: start; height: 100vh; display: flex;
    flex-direction: column; align-items: center; gap: 4px; padding: 18px 0;
    border-right: 1px solid var(--line); background: var(--paper); }
  .rail .brand { width: 30px; height: 30px; display: grid; place-items: center; color: var(--teal-deep); margin-bottom: 14px; }
  .railbtn { width: var(--tap); height: var(--tap); display: grid; place-items: center; background: none; border: none; color: var(--ink-3); border-radius: 11px; }
  .railbtn:hover { color: var(--ink-2); background: var(--line-2); }
  .railbtn.active { color: var(--teal-deep); }
  .railbtn svg { width: 21px; height: 21px; }
  .rail .spacer { flex: 1; }

  /* ---- the shared document canvas ---- */
  .sheet { background: var(--paper); min-height: 100vh; }
  .doc { max-width: 760px; margin: 0 auto; padding: 40px 40px 120px; }
  .doc.fade { animation: fade .28s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---- top strip: worker + caseload counts / tools ---- */
  .topstrip { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 26px; }
  .worker { font-size: var(--fs-meta); color: var(--ink-2); font-weight: 500; }
  .worker b { color: var(--ink); font-weight: 600; }
  .toollinks { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .toollinks .tbtn { font-size: var(--fs-meta); }
  .caseloads { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .cl { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-meta); color: var(--ink-2); }

  /* ---- big light manuscript heading (both views) ---- */
  .caseName { font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; color: var(--ink); margin: 6px 0 14px; }

  /* ===================== LIST VIEW ===================== */
  .search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 10px 2px; margin: 6px 0 20px; }
  .search svg { width: 18px; height: 18px; color: var(--teal-deep); flex: 0 0 auto; }
  .search input { flex: 1; border: 0; outline: none; background: none; font: inherit; font-size: 1rem; color: var(--ink); }
  .search input::placeholder { color: var(--ink-3); }

  .tabs { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 8px 0 12px; color: var(--ink-2); font-size: var(--fs-meta); font-weight: 500; }
  .tab.active { color: var(--ink); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--teal); }
  .tab .dot { margin-right: -2px; }

  .shown { font-size: var(--fs-micro); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 18px 0 2px; }

  .crow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none;
    border: 0; border-top: 1px solid var(--line); padding: 17px 6px; cursor: pointer; border-radius: 8px; }
  .crow:last-child { border-bottom: 1px solid var(--line); }
  .crow:hover { background: var(--teal-tint); }
  .crow .who { min-width: 0; }
  .crow .cname { font-size: 1.02rem; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 9px; }
  .crow .cmeta { font-size: var(--fs-meta); color: var(--ink-2); margin-top: 2px; padding-left: 17px; }
  .crow .right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: 0 0 auto; }
  .crow .fr { font-size: var(--fs-micro); color: var(--ink-3); }
  .crow .fr b { color: var(--teal-deep); font-weight: 700; }

  /* ===================== CASE VIEW ===================== */
  .back { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--ink-2); font-size: var(--fs-meta); font-weight: 500; padding: 4px 0; margin-bottom: 18px; }
  .back:hover { color: var(--teal-deep); }
  .back svg { width: 16px; height: 16px; }

  .caseMeta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: var(--fs-meta); color: var(--ink-2); padding-bottom: 22px; }
  .caseMeta .sep { color: var(--line); }
  .caseMeta .status { display: inline-flex; align-items: center; gap: 7px; }
  .rule { height: 1px; background: var(--line); border: 0; margin: 0; }

  .aiblock { padding: 26px 0 8px; }
  .aiblock .eyebrow { display: block; margin-bottom: 12px; }
  .aiText { font-size: 1.06rem; line-height: 1.68; color: var(--ink); max-width: 66ch; }

  .due { display: flex; align-items: baseline; gap: 12px 14px; flex-wrap: wrap; padding: 20px 0 4px; }
  .due .lbl { font-size: var(--fs-meta); color: var(--ink-3); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; font-size: var(--fs-meta); color: var(--ink-2); background: none; min-height: 34px; }
  .chip .dot { background: var(--st-review); }

  /* compose — borderless writing line, no box in a box */
  .compose { padding: 40px 0 8px; }
  .compose h2 { font-size: var(--fs-title); font-weight: 500; color: var(--ink); margin: 0 0 4px; letter-spacing: -0.01em; }
  .consent { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: var(--fs-micro); color: var(--ink-3); line-height: 1.5; margin: 6px 0 18px; max-width: 64ch; }
  .consent .tbtn { font-size: var(--fs-micro); padding: 0; }
  .writeField { border: 0; outline: none; background: none; width: 100%; font-family: var(--sans); font-size: 1.06rem; line-height: 1.68; color: var(--ink); resize: none; padding: 4px 0; min-height: 88px; max-width: 66ch; display: block; }
  .writeField::placeholder { color: var(--ink-3); }
  .composeBar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; max-width: 66ch; }
  .fmt { display: flex; align-items: center; gap: 2px; }
  .fmtbtn { width: 34px; height: 34px; display: grid; place-items: center; background: none; border: none; color: var(--ink-3); border-radius: 8px; font-size: 0.9rem; }
  .fmtbtn:hover { color: var(--ink-2); background: var(--line-2); }
  .fmtbtn.b { font-weight: 800; }
  .fmtbtn.i { font-style: italic; font-family: Georgia, serif; }
  .fmtbtn svg { width: 17px; height: 17px; }
  .composeBar .helper { flex: 1; min-width: 180px; font-size: var(--fs-micro); color: var(--ink-3); line-height: 1.45; }
  .btn-primary { appearance: none; border: none; background: var(--teal); color: #fff; font-weight: 600; font-size: var(--fs-meta); padding: 0 20px; height: var(--tap); min-height: var(--tap); border-radius: 11px; white-space: nowrap; }
  .btn-primary:hover { background: var(--teal-deep); }

  /* history — airy editorial timeline */
  .history { padding-top: 26px; }
  .history > .eyebrow { display: block; margin-bottom: 6px; }
  .entry { padding: 30px 0; border-top: 1px solid var(--line); }
  .entry:last-child { border-bottom: 1px solid var(--line); }
  .visitLine { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .visitLine .date { font-size: var(--fs-meta); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 96px; }
  .visitLine .statuslabel { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-meta); color: var(--ink); font-weight: 500; }
  .visit.current .statuslabel { color: var(--teal-deep); }
  .visitExtra { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 12px 0 0 108px; }
  .seal { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: var(--fs-micro); color: var(--ink-3); letter-spacing: 0.01em; }
  .seal b { color: var(--ink-2); font-weight: 600; }
  .fromRecord { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-micro); color: var(--ink-3); }
  .visitExtra .tbtn { font-size: var(--fs-micro); padding: 0; }
  .noteText { font-size: 1.04rem; line-height: 1.7; color: var(--ink); max-width: 64ch; margin: 0 0 12px; }
  .noteMeta { font-size: var(--fs-micro); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

  @media (max-width: 640px) { .visitExtra { margin-left: 0; } .visitLine .date { min-width: 0; } }
  @media (max-width: 560px) { .doc { padding: 28px 22px 100px; } }
</style>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Primary">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c8 0 8 6 8 12"/><path d="M20 6c-8 0-8 6-8 12"/></svg>
      </div>
      <button class="railbtn active" aria-label="Caseload" title="Caseload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="railbtn" aria-label="Cases" title="Cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg></button>
      <button class="railbtn" aria-label="Calendar" title="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></button>
      <button class="railbtn" aria-label="Seals and records" title="Seals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V6z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></button>
      <div class="spacer"></div>
      <button class="railbtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 7l2.6 1.5M17.2 15.5L19.8 17M4.2 17l2.6-1.5M17.2 8.5L19.8 7"/></svg></button>
    </nav>

    <main class="sheet"><div class="doc" id="doc"></div></main>
  </div>

  <script src="data.js"></script>
  <script>
  (function () {
    var F = window.FOSTR, open = F.open, doc = document.getElementById("doc");
    var STATUS = { review: "Needs review", queue: "In queue", done: "Up to date", safety: "Safety" };

    function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
    function fade() { doc.classList.remove("fade"); void doc.offsetWidth; doc.classList.add("fade"); }

    var icoList = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>';
    var icoBack = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
    var icoSearch = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>';

    /* ==================== LIST VIEW ==================== */
    function renderList(filter) {
      filter = filter || "all";
      doc.innerHTML = ""; fade();
      var counts = F.counts;

      // top strip: worker + tools (Tools folded into one calm row — no side shell)
      var top = el("div", "topstrip");
      top.appendChild(el("div", "worker", 'Caseload of <b>' + F.worker.name + '</b>'));
      var tools = el("div", "toollinks");
      F.tools.forEach(function (t) { tools.appendChild(el("button", "tbtn", t)); });
      top.appendChild(tools);
      doc.appendChild(top);

      doc.appendChild(el("h1", "caseName", F.worker.first + "’s Fieldbook"));

      // search
      var search = el("div", "search");
      search.innerHTML = icoSearch;
      var input = el("input"); input.setAttribute("placeholder", "Search by name"); input.setAttribute("aria-label", "Search by name");
      search.appendChild(input);
      doc.appendChild(search);

      // filter tabs with turquoise count badges
      var tabDefs = [
        { key: "all", label: "All", dot: null, n: counts.all },
        { key: "review", label: "Needs review", dot: "review", n: counts.review },
        { key: "queue", label: "In queue", dot: "queue", n: counts.queue },
        { key: "done", label: "Up to date", dot: "done", n: counts.done },
        { key: "safety", label: "Safety", dot: "safety", n: counts.safety }
      ];
      var tabs = el("div", "tabs");
      tabDefs.forEach(function (t) {
        var b = el("button", "tab" + (t.key === filter ? " active" : ""));
        if (t.dot) b.appendChild(el("span", "dot " + t.dot));
        b.appendChild(el("span", null, t.label + " "));
        b.appendChild(el("span", "count", String(t.n)));
        b.onclick = function () { renderList(t.key); };
        tabs.appendChild(b);
      });
      doc.appendChild(tabs);

      var rows = F.cases.filter(function (c) { return filter === "all" ? true : c.status === filter; });
      doc.appendChild(el("div", "shown", rows.length + " shown"));

      rows.forEach(function (c) {
        var row = el("button", "crow");
        var who = el("div", "who");
        var name = el("div", "cname");
        name.appendChild(el("span", "dot " + c.status));
        name.appendChild(el("span", null, c.name));
        who.appendChild(name);
        who.appendChild(el("div", "cmeta", c.age + " · " + c.care + " · " + c.label));
        row.appendChild(who);
        var right = el("div", "right");
        var pct = Math.round((c.fromRecord / 11) * 100);
        right.innerHTML = '<span class="meter"><i style="width:' + pct + '%"></i></span>' +
                          '<span class="fr"><b>' + c.fromRecord + '</b>/11 from record</span>';
        row.appendChild(right);
        row.onclick = function () { renderCase(c); };
        doc.appendChild(row);
      });
    }

    /* ==================== CASE VIEW ==================== */
    function renderCase(c) {
      doc.innerHTML = ""; fade();
      window.scrollTo(0, 0);

      var back = el("button", "back", icoBack + "<span>All cases</span>");
      back.onclick = function () { renderList(); };
      doc.appendChild(back);

      doc.appendChild(el("h1", "caseName", c.name));

      var meta = el("div", "caseMeta");
      meta.appendChild(el("span", null, c.age + " years"));
      meta.appendChild(el("span", "sep", "·"));
      meta.appendChild(el("span", null, c.care));
      meta.appendChild(el("span", "sep", "·"));
      meta.appendChild(el("span", null, open.caseId));
      meta.appendChild(el("span", "sep", "·"));
      var stt = el("span", "status");
      stt.appendChild(el("span", "dot " + c.status));
      stt.appendChild(el("span", null, c.label || STATUS[c.status]));
      meta.appendChild(stt);
      doc.appendChild(meta);
      doc.appendChild(el("hr", "rule"));

      var ai = el("div", "aiblock");
      ai.appendChild(el("span", "eyebrow", "AI summary — drafted from the record"));
      ai.appendChild(el("p", "aiText", open.aiSummary));
      doc.appendChild(ai);

      if (open.tasks && open.tasks.length) {
        var due = el("div", "due");
        due.appendChild(el("span", "lbl", "Due"));
        open.tasks.forEach(function (t) {
          var chip = el("span", "chip"); chip.appendChild(el("span", "dot")); chip.appendChild(el("span", null, t)); due.appendChild(chip);
        });
        doc.appendChild(due);
      }

      var cc = open.composer;
      var compose = el("section", "compose");
      compose.appendChild(el("h2", null, "Add to " + c.name.split(" ")[0] + "’s record"));
      var consent = el("div", "consent");
      consent.appendChild(el("span", null, cc.consent));
      consent.appendChild(el("button", "tbtn", "Record consent"));
      compose.appendChild(consent);
      var field = el("textarea", "writeField");
      field.setAttribute("placeholder", cc.placeholder); field.setAttribute("rows", "3"); field.setAttribute("aria-label", "Write a note");
      field.addEventListener("input", function () { this.style.height = "auto"; this.style.height = this.scrollHeight + "px"; });
      compose.appendChild(field);
      var bar = el("div", "composeBar");
      var fmt = el("div", "fmt");
      var bB = el("button", "fmtbtn b", "B"); var iB = el("button", "fmtbtn i", "I"); var lB = el("button", "fmtbtn", icoList);
      fmt.appendChild(bB); fmt.appendChild(iB); fmt.appendChild(lB);
      bar.appendChild(fmt); bar.appendChild(el("span", "helper", cc.helper));
      bar.appendChild(el("button", "btn-primary", "Save note"));
      compose.appendChild(bar);
      doc.appendChild(compose);

      var hist = el("section", "history");
      hist.appendChild(el("span", "eyebrow", "Case history"));
      open.history.forEach(function (h) {
        if (h.kind === "visit") {
          var entry = el("div", "entry visit" + (h.current ? " current" : ""));
          var line = el("div", "visitLine");
          line.appendChild(el("span", "date", h.date));
          var sl = el("span", "statuslabel"); sl.appendChild(el("span", "dot " + h.status)); sl.appendChild(el("span", null, h.statusLabel));
          line.appendChild(sl); entry.appendChild(line);
          var extra = el("div", "visitExtra");
          if (h.meter != null) { var fr = el("span", "fromRecord"); var pct = Math.max(0, Math.min(100, (h.meter / 5) * 100));
            fr.innerHTML = '<span class="meter"><i style="width:' + pct + '%"></i></span> ' + h.meter + ' from record'; extra.appendChild(fr); }
          if (h.sealed) extra.appendChild(el("span", "seal", '<b>Sealed</b> ' + h.sealed + ' &middot; ' + h.sor + (h.delivered ? ' &middot; delivered' : '')));
          if (h.amend) extra.appendChild(el("button", "tbtn", "Amend record"));
          if (extra.childNodes.length) entry.appendChild(extra);
          hist.appendChild(entry);
        } else {
          var n = el("div", "entry note");
          n.appendChild(el("p", "noteText", h.text));
          n.appendChild(el("div", "noteMeta", h.noteType + " · " + h.author + " · " + h.date));
          hist.appendChild(n);
        }
      });
      doc.appendChild(hist);
    }

    renderList();       // land on the caseload; tap a name to open the case
  })();
  </script>
</body>
</html>
