<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fieldbook — Andre Baptiste (Write-in-stream)</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ------ layout only; all color/tokens come from tokens.css ------ */
  .app { display: grid; grid-template-columns: 60px 1fr; min-height: 100vh; }

  /* slim left nav rail — 5 quiet icons */
  .rail {
    position: sticky; top: 0; align-self: start; height: 100vh;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 0; border-right: 1px solid var(--line); background: var(--paper);
  }
  .rail .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--teal);
    display: grid; place-items: center; color: #fff; font-weight: 800; margin-bottom: 10px; font-size: .8rem; }
  .rail button {
    width: var(--tap); height: var(--tap); border: none; background: none;
    display: grid; place-items: center; border-radius: 10px; color: var(--ink-3);
  }
  .rail button:hover { color: var(--ink); background: var(--line-2); }
  .rail button[aria-current="true"] { color: var(--teal-deep); background: var(--teal-tint); }
  .rail .grow { flex: 1; }

  /* centered reading column */
  .wrap { display: flex; justify-content: center; padding: 22px clamp(16px, 4vw, 40px) 120px; }
  .col { width: 100%; max-width: 720px; }

  /* top strip: worker + caseload counts */
  .strip { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .strip .who { font-weight: 600; color: var(--ink-2); }
  .strip .counts { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .strip .cx { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: var(--fs-meta); }

  /* case header */
  .head h1 { font-size: var(--fs-hero); margin: 0 0 6px; letter-spacing: -0.01em; }
  .head .sub { color: var(--ink-2); font-size: var(--fs-meta); }
  .head .status { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font-size: var(--fs-meta); color: var(--ink-2); }

  /* AI summary — not boxed */
  .ai { margin: 22px 0 6px; }
  .ai p { margin: 8px 0 0; color: var(--ink-2); line-height: 1.6; max-width: 66ch; }

  /* due tasks — outline/text chips only */
  .due { margin: 22px 0 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .due .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); color: var(--ink-2); background: none;
    border-radius: 999px; padding: 7px 12px; font-size: var(--fs-meta); min-height: 34px; }

  /* the single stream */
  .stream { margin-top: 26px; }
  .stream .lead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; }

  /* every entry — separated by whitespace + faint hairline only. NO boxes. */
  .entry { padding: 20px 0; border-top: 1px solid var(--line-2); }
  .entry:first-child { border-top: none; }

  /* the compose entry: styled IDENTICALLY to a note — a borderless inline field */
  .compose .consent { display: flex; align-items: center; gap: 8px; font-size: var(--fs-micro); color: var(--ink-3); margin-bottom: 12px; line-height: 1.5; }
  .field {
    width: 100%; border: none; background: none; resize: none; outline: none;
    font: inherit; color: var(--ink); line-height: 1.6; padding: 0; min-height: 1.6em;
    overflow: hidden;
  }
  .field:empty:before { content: attr(data-ph); color: var(--ink-3); }
  .toolrow { display: flex; align-items: center; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .toolrow .fmt { display: flex; gap: 2px; margin-right: 6px; }
  .toolrow .fmt button {
    width: 34px; height: 34px; border: none; background: none; border-radius: 8px;
    color: var(--ink-3); font-size: .9rem; display: grid; place-items: center;
  }
  .toolrow .fmt button:hover { color: var(--ink); background: var(--line-2); }
  .toolrow .fmt button b, .toolrow .fmt button i { font-size: .95rem; }
  .helper { color: var(--ink-3); font-size: var(--fs-micro); margin-right: auto; max-width: 44ch; line-height: 1.4; }
  .save {
    border: none; background: var(--teal); color: #fff; font-weight: 600;
    border-radius: 999px; padding: 0 18px; min-height: var(--tap); font-size: var(--fs-meta);
  }
  .save:hover { background: var(--teal-deep); }
  .save[disabled] { opacity: .45; cursor: default; }

  /* note entry */
  .note .body { color: var(--ink); line-height: 1.65; max-width: 66ch; outline: none; }
  .note .body:focus { background: var(--teal-tint); border-radius: 8px; box-shadow: 0 0 0 6px var(--teal-tint); }
  .note .meta { margin-top: 10px; font-size: var(--fs-micro); color: var(--ink-3); }

  /* visit entry — a quiet milestone in the stream */
  .visit .top { display: flex; align-items: center; gap: 9px; font-size: var(--fs-meta); }
  .visit .top .lbl { color: var(--ink-2); }
  .visit .top .dt { color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
  .visit .seal { margin-top: 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-micro); color: var(--ink-3); }
  .visit .row2 { margin-top: 8px; display: flex; align-items: center; gap: 16px; }
  .visit .from { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-micro); color: var(--ink-3); }

  @media (max-width: 1024px) { .app { grid-template-columns: 56px 1fr; } }
</style>
</head>
<body class="dotgrid">
  <div class="app">
    <nav class="rail" aria-label="Primary">
      <div class="mark">F</div>
      <button aria-current="true" title="Cases" aria-label="Cases">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <button title="Search" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      </button>
      <button title="Reviews" aria-label="Reviews">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
      <button title="Records" aria-label="Records">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      </button>
      <div class="grow"></div>
      <button title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      </button>
    </nav>

    <div class="wrap">
      <main class="col">
        <div class="strip">
          <span class="who" id="who"></span>
          <div class="counts" id="counts"></div>
        </div>

        <header class="head">
          <h1 id="caseName"></h1>
          <div class="sub" id="caseSub"></div>
          <div class="status"><span class="dot" id="caseDot"></span><span id="caseStatus"></span></div>
        </header>

        <section class="ai">
          <span class="eyebrow">AI summary</span>
          <p id="aiSummary"></p>
        </section>

        <section class="due">
          <span class="eyebrow" style="align-self:center">Due</span>
          <div class="chips" id="tasks"></div>
        </section>

        <section class="stream" aria-label="Case history">
          <div class="lead"><span class="eyebrow">This case, in your words</span></div>
          <div id="stream"></div>
        </section>
      </main>
    </div>
  </div>

<script src="data.js"></script>
<script>
(function () {
  var F = window.FOSTR, O = F.open;
  var el = function (t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

  // top strip
  document.getElementById('who').textContent = F.worker.name;
  var counts = document.getElementById('counts');
  [['All', F.counts.all, ''], ['Review', F.counts.review, 'review'], ['Queue', F.counts.queue, 'queue'], ['Safety', F.counts.safety, 'safety']]
    .forEach(function (c) {
      var s = el('span', 'cx');
      if (c[2]) s.appendChild(el('span', 'dot ' + c[2]));
      s.appendChild(document.createTextNode(c[0] + ' '));
      var b = el('span', 'count', c[1]); s.appendChild(b);
      counts.appendChild(s);
    });

  // header
  document.getElementById('caseName').textContent = O.name;
  document.getElementById('caseSub').textContent = O.age + ' · ' + O.care + ' · ' + O.caseId;
  document.getElementById('caseDot').className = 'dot ' + O.status;
  document.getElementById('caseStatus').textContent = O.statusLabel;
  document.getElementById('aiSummary').textContent = O.aiSummary;

  // due tasks — outline chips
  var tasks = document.getElementById('tasks');
  O.tasks.forEach(function (t) { tasks.appendChild(el('span', 'chip', t)); });

  var stream = document.getElementById('stream');

  // ---- the compose entry: same-stream, borderless, top of the list ----
  var compose = el('article', 'entry compose');

  var consent = el('div', 'consent');
  consent.appendChild(el('span', 'dot safety'));
  consent.appendChild(document.createTextNode(O.composer.consent + ' '));
  var rec = el('a', null, 'Record consent'); rec.href = '#'; rec.className = 'tbtn';
  rec.style.padding = '0'; rec.style.fontSize = 'var(--fs-micro)';
  rec.addEventListener('click', function (e) { e.preventDefault(); });
  consent.appendChild(rec);
  compose.appendChild(consent);

  var field = el('div', 'field');
  field.setAttribute('contenteditable', 'true');
  field.setAttribute('role', 'textbox');
  field.setAttribute('aria-label', 'New note');
  field.setAttribute('data-ph', O.composer.placeholder);
  compose.appendChild(field);

  var toolrow = el('div', 'toolrow');
  var fmt = el('div', 'fmt');
  [['bold', '<b>B</b>'], ['italic', '<i>I</i>'], ['insertUnorderedList', '&bull;&nbsp;&mdash;'.replace('—','–')]]
    .forEach(function (cmd) {
      var b = el('button'); b.type = 'button'; b.innerHTML = cmd[1];
      b.title = cmd[0]; b.setAttribute('aria-label', cmd[0]);
      b.addEventListener('mousedown', function (e) { e.preventDefault(); document.execCommand(cmd[0], false, null); field.focus(); });
      fmt.appendChild(b);
    });
  toolrow.appendChild(fmt);
  toolrow.appendChild(el('span', 'helper', O.composer.helper));
  var save = el('button', 'save', 'Save note'); save.type = 'button'; save.disabled = true;
  toolrow.appendChild(save);
  compose.appendChild(toolrow);

  field.addEventListener('input', function () { save.disabled = field.textContent.trim() === ''; });

  save.addEventListener('click', function () {
    var text = field.textContent.trim();
    if (!text) return;
    var note = buildNote({ noteType: 'Quick note', author: F.worker.name, date: today(), text: text }, true);
    // insert directly beneath the composer — newest written entry at the very top
    stream.insertBefore(note, compose.nextSibling);
    field.innerHTML = ''; save.disabled = true;
    note.querySelector('.body').focus();
  });

  stream.appendChild(compose);

  // ---- render history into the same stream ----
  O.history.forEach(function (h) {
    stream.appendChild(h.kind === 'visit' ? buildVisit(h) : buildNote(h, false));
  });

  function buildNote(n, isNew) {
    var e = el('article', 'entry note');
    var body = el('div', 'body', n.text);
    body.setAttribute('contenteditable', 'true');
    body.setAttribute('role', 'textbox');
    body.setAttribute('aria-label', 'Edit note');
    e.appendChild(body);
    var meta = el('div', 'meta', n.noteType + ' · ' + n.author + ' · ' + n.date);
    e.appendChild(meta);
    return e;
  }

  function buildVisit(v) {
    var e = el('article', 'entry visit');
    var top = el('div', 'top');
    top.appendChild(el('span', 'dot ' + v.status));
    top.appendChild(el('span', 'lbl', v.statusLabel));
    top.appendChild(el('span', 'dt', v.date));
    e.appendChild(top);

    if (v.sealed) {
      var seal = el('div', 'seal');
      seal.appendChild(el('span', null, 'sealed ' + v.sealed));
      seal.appendChild(el('span', null, v.sor));
      e.appendChild(seal);
    }

    var row2 = el('div', 'row2');
    if (typeof v.meter === 'number') {
      var from = el('span', 'from');
      from.appendChild(document.createTextNode('from record'));
      var m = el('span', 'meter'); var inner = el('i');
      inner.style.width = Math.round((v.meter / 7) * 100) + '%'; m.appendChild(inner);
      from.appendChild(m);
      row2.appendChild(from);
    }
    if (v.amend) {
      var a = el('button', 'tbtn', 'Amend record'); a.type = 'button';
      a.style.fontSize = 'var(--fs-micro)';
      row2.appendChild(a);
    }
    if (row2.childNodes.length) e.appendChild(row2);
    return e;
  }

  function today() {
    var d = new Date();
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
})();
</script>
</body>
</html>
