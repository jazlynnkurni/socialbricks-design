<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fostr — Sign in</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* v2 — "Living Caustic Gradient"
     Only layout + motion here. Base primitives come from tokens.css. */

  .screen {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
  }

  /* ---------- LEFT: living caustic brand panel ---------- */
  .brand {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(32px, 4vw, 64px);
    color: #fff;
    /* deep teal base the light flows over */
    background: radial-gradient(120% 120% at 20% 10%, var(--teal) 0%, var(--teal-deep) 55%, #1e5150 100%);
  }

  /* Three large, soft light bodies that drift like caustics through water.
     Each is a blurred radial gradient moved only with transforms (GPU-friendly). */
  .caustic {
    position: absolute;
    inset: -30%;
    z-index: -2;
    pointer-events: none;
  }
  .caustic span {
    position: absolute;
    width: 60%;
    aspect-ratio: 1;
    border-radius: 50%;
    filter: blur(46px);
    mix-blend-mode: screen;
    opacity: 0.85;
    will-change: transform;
    transform: translateZ(0);
  }
  .caustic .c1 {
    left: 8%; top: 6%;
    background: radial-gradient(circle at 50% 50%, rgba(148,214,208,0.95), rgba(148,214,208,0) 68%);
    animation: drift1 19s ease-in-out infinite alternate;
  }
  .caustic .c2 {
    right: 4%; top: 34%;
    background: radial-gradient(circle at 50% 50%, rgba(94,161,161,0.9), rgba(94,161,161,0) 66%);
    animation: drift2 24s ease-in-out infinite alternate;
  }
  .caustic .c3 {
    left: 24%; bottom: 2%;
    width: 72%;
    background: radial-gradient(circle at 50% 50%, rgba(210,236,231,0.7), rgba(210,236,231,0) 64%);
    animation: drift3 31s ease-in-out infinite alternate;
  }

  @keyframes drift1 {
    0%   { transform: translate3d(-6%, -4%, 0) scale(1);    }
    50%  { transform: translate3d(10%,  8%, 0) scale(1.18); }
    100% { transform: translate3d(4%,  -8%, 0) scale(1.05); }
  }
  @keyframes drift2 {
    0%   { transform: translate3d(6%,  4%, 0) scale(1.1);  }
    50%  { transform: translate3d(-8%, -6%, 0) scale(0.9); }
    100% { transform: translate3d(-2%, 10%, 0) scale(1.15);}
  }
  @keyframes drift3 {
    0%   { transform: translate3d(0, 6%, 0) scale(1);      }
    50%  { transform: translate3d(-10%, -4%, 0) scale(1.2);}
    100% { transform: translate3d(8%, 2%, 0) scale(0.95);  }
  }

  /* Fine caustic ripple — a faint light-through-water lattice that breathes.
     Purely decorative; sits above the light bodies, below content. */
  .ripple {
    position: absolute;
    inset: -20%;
    z-index: -1;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: screen;
    background:
      repeating-radial-gradient(circle at 30% 40%, transparent 0 22px, rgba(255,255,255,0.5) 23px 24px, transparent 25px 60px),
      repeating-radial-gradient(circle at 72% 66%, transparent 0 26px, rgba(255,255,255,0.4) 27px 28px, transparent 29px 66px);
    background-size: 260px 260px, 320px 320px;
    animation: shimmer 26s ease-in-out infinite alternate;
    will-change: transform, opacity;
  }
  @keyframes shimmer {
    0%   { transform: translate3d(0,0,0) scale(1);        opacity: 0.10; }
    50%  { transform: translate3d(2%, -2%, 0) scale(1.06); opacity: 0.20; }
    100% { transform: translate3d(-2%, 1%, 0) scale(1.02); opacity: 0.13; }
  }

  /* keeps text crisp over the moving light */
  .brand::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(20,58,57,0.28) 0%, transparent 26% 68%, rgba(20,58,57,0.42) 100%);
  }

  .brand__mark img { height: 30px; width: auto; display: block; }

  .brand__line {
    max-width: 15ch;
    font-size: clamp(1.9rem, 3.1vw, 2.9rem);
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -0.02em;
    margin: 0;
    text-shadow: 0 1px 24px rgba(16,48,47,0.35);
  }
  .brand__sub {
    margin: 16px 0 0;
    max-width: 34ch;
    font-size: 1rem;
    font-weight: 400;
    color: rgba(255,255,255,0.82);
  }
  .brand__foot {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.7);
  }

  /* ---------- RIGHT: sign-in form ---------- */
  .pane {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 4vw, 56px);
  }
  .card { width: 100%; max-width: 380px; }

  .card__mark { display: none; }
  .card__mark img { height: 30px; width: auto; }

  .card h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .card__hint { margin: 0 0 26px; font-size: 0.95rem; }

  .stack > * + * { margin-top: 16px; }

  .pw-wrap { position: relative; }
  .pw-wrap > input { padding-right: 68px; }
  .pw-toggle {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    height: 34px; padding: 0 10px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--teal-deep);
    font-weight: 600; font-size: 0.82rem;
    cursor: pointer;
  }
  .pw-toggle:hover { background: var(--teal-tint); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
  }
  .check {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 0.9rem;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }
  .check input {
    width: 18px; height: 18px;
    accent-color: var(--teal-deep);
    cursor: pointer;
  }

  .card__submit { margin-top: 22px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 20px 0;
    color: var(--ink-3);
    font-size: 0.82rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .support {
    margin: 26px 0 0;
    font-size: 0.85rem;
    color: var(--ink-3);
    text-align: center;
  }

  .sso-icon { width: 17px; height: 17px; opacity: 0.8; }

  /* ---------- responsive: stack, form-first ---------- */
  @media (max-width: 820px) {
    .screen { grid-template-columns: 1fr; }
    .brand {
      order: 2;
      min-height: 240px;
      justify-content: flex-end;
    }
    .brand__mark { display: none; }
    .pane { order: 1; }
    .card__mark { display: block; margin-bottom: 22px; }
    .brand__line { font-size: clamp(1.5rem, 6vw, 2rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    .caustic span, .ripple { animation: none !important; }
    /* freeze to a calm static gradient */
    .caustic .c1 { transform: translate3d(2%, 0, 0) scale(1.05); }
    .caustic .c2 { transform: translate3d(-4%, -2%, 0) scale(1.02); }
    .caustic .c3 { transform: translate3d(0, 2%, 0) scale(1.08); }
    .ripple { opacity: 0.12; }
  }
</style>
</head>
<body>
  <main class="screen">

    <!-- LEFT: living caustic brand panel -->
    <section class="brand" aria-hidden="false">
      <div class="caustic" aria-hidden="true">
        <span class="c1"></span>
        <span class="c2"></span>
        <span class="c3"></span>
      </div>
      <div class="ripple" aria-hidden="true"></div>

      <div class="brand__mark">
        <img src="fostr-wordmark-white.png" alt="Fostr">
      </div>

      <div>
        <p class="brand__line">The record stays steady, even when the day doesn't.</p>
        <p class="brand__sub">Casework moves fast. Fostr keeps every note, contact, and decision in one calm place.</p>
      </div>

      <p class="brand__foot">Secure sign-in for agency staff.</p>
    </section>

    <!-- RIGHT: sign-in form -->
    <section class="pane">
      <div class="card">
        <div class="card__mark"><img src="fostr-wordmark-black.png" alt="Fostr"></div>

        <h1>Sign in</h1>
        <p class="card__hint muted">Use the account your agency set up for you.</p>

        <form id="signin" novalidate>
          <div class="stack">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username"
                     inputmode="text" autocapitalize="none" spellcheck="false"
                     placeholder="jordan.rivera" required>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="Your password" required>
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
              </div>
            </div>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="keep" name="keep">
              Keep me signed in
            </label>
            <a class="link" href="#" id="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary card__submit" id="submitBtn">Sign in</button>

          <div class="divider">or</div>

          <button type="button" class="btn-ghost" id="ssoBtn">
            <svg class="sso-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2 4 6v6c0 5 3.4 8.2 8 10 4.6-1.8 8-5 8-10V6l-8-4Z"
                    stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Sign in with agency SSO
          </button>
        </form>

        <p class="support">Trouble signing in? Ask your agency admin.</p>
      </div>
    </section>

  </main>

  <script>
    (function () {
      var form = document.getElementById('signin');
      var pw = document.getElementById('password');
      var pwToggle = document.getElementById('pwToggle');
      var submitBtn = document.getElementById('submitBtn');
      var ssoBtn = document.getElementById('ssoBtn');
      var forgot = document.getElementById('forgot');

      pwToggle.addEventListener('click', function () {
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        pwToggle.textContent = showing ? 'Show' : 'Hide';
        pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        pw.focus();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (submitBtn.disabled) return;
        if (!form.checkValidity()) { form.reportValidity(); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        setTimeout(function () {
          submitBtn.textContent = 'Sign in';
          submitBtn.disabled = false;
        }, 1400);
      });

      var ssoMarkup = ssoBtn.innerHTML;
      ssoBtn.addEventListener('click', function () {
        if (ssoBtn.disabled) return;
        ssoBtn.disabled = true;
        ssoBtn.textContent = 'Opening agency sign-in…';
        setTimeout(function () { ssoBtn.innerHTML = ssoMarkup; ssoBtn.disabled = false; }, 1600);
      });

      forgot.addEventListener('click', function (e) { e.preventDefault(); });
    }());
  </script>
</body>
</html>
