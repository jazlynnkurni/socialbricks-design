<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fostr — Sign in</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ---- layout / motion only; base primitives come from tokens.css ---- */
  .stage {
    min-height: 100dvh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
  }

  /* ---------- LEFT: teal brand panel ---------- */
  .brand {
    position: relative;
    overflow: hidden;
    background: var(--teal-deep);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(32px, 4vw, 56px);
    isolation: isolate;
  }
  /* deep base wash so the tendrils read against it */
  .brand::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--teal) 55%, transparent), transparent 60%),
      linear-gradient(180deg, var(--teal-deep), color-mix(in srgb, var(--teal-deep) 82%, #06201f));
    z-index: -2;
  }
  .brand canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: -1;
    display: block;
  }

  .brand-top { display: flex; align-items: center; gap: 12px; }
  .brand-top img.wordmark { height: 26px; width: auto; display: block; }

  .brand-line {
    max-width: 15ch;
    font-size: clamp(1.5rem, 2.6vw, 2.15rem);
    font-weight: 600;
    line-height: 1.22;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .brand-foot {
    font-size: 0.85rem;
    color: color-mix(in srgb, #fff 72%, transparent);
    font-weight: 500;
  }

  /* ---------- RIGHT: sign-in form ---------- */
  .form-wrap {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 4vw, 56px);
  }
  .card { width: 100%; max-width: 384px; }

  .form-mark { display: none; margin-bottom: 30px; }
  .form-mark img { height: 24px; width: auto; }

  .card h1 { font-size: 1.42rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  .card .sub { color: var(--ink-2); font-size: 0.94rem; margin: 0 0 26px; }

  .field + .field { margin-top: 16px; }

  .pw-head { display: flex; align-items: baseline; justify-content: space-between; }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    height: 36px; min-width: 52px; padding: 0 10px;
    border: none; background: transparent; color: var(--teal-deep);
    font-size: 0.82rem; font-weight: 600; cursor: pointer; border-radius: 8px;
  }
  .pw-toggle:hover { background: var(--teal-tint); }

  .row { display: flex; align-items: center; gap: 10px; margin: 18px 0 22px; }
  .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--teal-deep); }
  .row label { font-size: 0.9rem; color: var(--ink-2); cursor: pointer; user-select: none; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 20px 0; color: var(--ink-3); font-size: 0.8rem; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }

  .sso-mark { width: 17px; height: 17px; }

  .forgot { display: block; text-align: center; margin-top: 22px; font-size: 0.88rem; }
  .support { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--ink-3); text-align: center; }

  .btn-primary[aria-busy="true"] { cursor: progress; filter: none; opacity: 0.9; }

  /* ---------- responsive: stacked, form-first ---------- */
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; }
    .form-wrap { order: -1; }
    .brand {
      min-height: 210px;
      padding: 26px 24px;
    }
    .brand-line { font-size: 1.35rem; max-width: 22ch; }
    .brand-foot { display: none; }
    .form-mark { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    /* JS also stops the loop; this is the belt-and-braces */
    .brand canvas { opacity: 0.9; }
  }
</style>
</head>
<body>
  <main class="stage">
    <!-- LEFT — brand panel -->
    <section class="brand" aria-hidden="false">
      <canvas id="roots" aria-hidden="true"></canvas>

      <div class="brand-top">
        <img class="wordmark" src="fostr-wordmark-white.png" alt="Fostr" />
      </div>

      <p class="brand-line">The case is a life. We keep the record of it.</p>

      <div class="brand-foot">Built for the people who carry the caseload.</div>
    </section>

    <!-- RIGHT — sign-in form -->
    <section class="form-wrap">
      <div class="card">
        <div class="form-mark"><img src="fostr-wordmark-black.png" alt="Fostr" /></div>

        <h1>Sign in</h1>
        <p class="sub">Pick up where the case left off.</p>

        <form id="signin" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   inputmode="text" placeholder="you@agency.gov" required />
          </div>

          <div class="field">
            <div class="pw-head">
              <label for="password">Password</label>
            </div>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                     placeholder="Your password" required />
              <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false"
                      aria-controls="password">Show</button>
            </div>
          </div>

          <div class="row">
            <input id="keep" name="keep" type="checkbox" />
            <label for="keep">Keep me signed in</label>
          </div>

          <button type="submit" class="btn-primary" id="submit">Sign in</button>

          <div class="divider" role="separator">or</div>

          <button type="button" class="btn-ghost" id="sso">
            <svg class="sso-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2.75a4.25 4.25 0 0 0-4.25 4.25V10H6.5A1.75 1.75 0 0 0 4.75 11.75v7.5A1.75 1.75 0 0 0 6.5 21h11a1.75 1.75 0 0 0 1.75-1.75v-7.5A1.75 1.75 0 0 0 17.5 10h-1.25V7A4.25 4.25 0 0 0 12 2.75Zm2.25 7.25h-4.5V7a2.25 2.25 0 0 1 4.5 0v3Z" fill="currentColor"/>
            </svg>
            Sign in with agency SSO
          </button>

          <a class="link forgot" href="#" id="forgot">Forgot password?</a>
        </form>

        <p class="support">Trouble signing in? Ask your agency admin.</p>
      </div>
    </section>
  </main>

<script>
(() => {
  "use strict";

  /* ---------------- Root-tendril field ----------------
     Fine filaments rise from the base of the teal panel like roots / sprout
     fibers. Each leans toward the pointer with a slow, eased pull and an
     ambient sway. No pointer (touch) -> gentle ambient breathing only.
     rAF-capped, DPR-aware, halts under prefers-reduced-motion.            */

  const canvas = document.getElementById("roots");
  const panel  = canvas.parentElement;
  const ctx    = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  let W = 0, H = 0, dpr = 1;
  let tendrils = [];
  let raf = 0, last = 0;

  // pointer state (normalized to canvas px); starts centred-ish and idle
  const pointer = { x: 0, y: 0, active: false };
  let idlePhase = 0;

  function build() {
    const rect = panel.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // density scales with width, capped so it never gets busy
    const count = Math.max(14, Math.min(34, Math.round(W / 26)));
    tendrils = [];
    for (let i = 0; i < count; i++) {
      const t = (i + 0.5) / count;
      tendrils.push({
        baseX: t * W + (Math.random() - 0.5) * (W / count) * 0.6,
        // length as a fraction of panel height
        len: H * (0.32 + Math.random() * 0.5),
        width: 0.8 + Math.random() * 1.3,
        // per-tendril sway character
        swaySpeed: 0.15 + Math.random() * 0.25,
        swayAmp: 8 + Math.random() * 16,
        phase: Math.random() * Math.PI * 2,
        // eased current bend offset at the tip
        bend: 0,
        reach: 0.25 + Math.random() * 0.65, // how strongly it answers the pointer
        alpha: 0.10 + Math.random() * 0.16,
      });
    }
    if (!pointer.active) { pointer.x = W * 0.5; pointer.y = H * 0.42; }
  }

  function draw(dt, time) {
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";

    idlePhase += dt * 0.35;

    // when idle, the "attractor" breathes slowly across the panel
    let px = pointer.x, py = pointer.y;
    if (!pointer.active) {
      px = W * (0.5 + 0.26 * Math.sin(idlePhase * 0.5));
      py = H * (0.5 + 0.14 * Math.sin(idlePhase * 0.33 + 1.1));
    }

    for (const d of tendrils) {
      const rootX = d.baseX;
      const rootY = H + 6;                 // anchored just below the base
      const tipYrest = H - d.len;

      // horizontal pull of the tip toward the attractor, distance-softened
      const dx = px - rootX;
      const vspan = Math.max(1, H);
      const vcloseness = 1 - Math.min(1, Math.abs(py - tipYrest) / vspan);
      const pull = dx * 0.18 * d.reach * (0.5 + 0.5 * vcloseness);

      // ambient sway (always present, gentle)
      const sway = Math.sin(time * d.swaySpeed + d.phase) * d.swayAmp;

      const targetBend = pull + sway;
      // critically-damped-ish easing so it never jitters
      d.bend += (targetBend - d.bend) * Math.min(1, dt * 1.8);

      const tipX = rootX + d.bend;
      const tipY = tipYrest;
      // control point: mid-height, half the bend -> smooth arc
      const cx = rootX + d.bend * 0.45;
      const cy = rootY - d.len * 0.55;

      const grad = ctx.createLinearGradient(rootX, rootY, tipX, tipY);
      grad.addColorStop(0, "rgba(255,255,255,0)");
      grad.addColorStop(0.35, "rgba(214,238,232," + (d.alpha * 0.6).toFixed(3) + ")");
      grad.addColorStop(1, "rgba(232,247,240," + d.alpha.toFixed(3) + ")");

      ctx.beginPath();
      ctx.moveTo(rootX, rootY);
      ctx.quadraticCurveTo(cx, cy, tipX, tipY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = d.width;
      ctx.stroke();

      // soft node at the tip — a little seed of light
      const tipGlow = 0.35 + 0.35 * vcloseness;
      ctx.beginPath();
      ctx.arc(tipX, tipY, d.width * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(236,249,242," + (d.alpha * tipGlow).toFixed(3) + ")";
      ctx.fill();
    }

    // warm pointer halo — the panel feels "reached toward"
    if (pointer.active) {
      const r = Math.min(W, H) * 0.42;
      const halo = ctx.createRadialGradient(px, py, 0, px, py, r);
      halo.addColorStop(0, "rgba(120,200,180,0.14)");
      halo.addColorStop(1, "rgba(120,200,180,0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    draw(dt, now / 1000);
    raf = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(raf);
    if (reduce.matches) {           // render one calm static frame, then stop
      pointer.active = false;
      idlePhase = 0.6;
      draw(0, 0);
      return;
    }
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  // ---- pointer wiring (fine pointers only) ----
  const finePointer = window.matchMedia("(pointer: fine)");
  function onMove(e) {
    if (!finePointer.matches) return;
    const rect = panel.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.active = true;
  }
  function onLeave() { pointer.active = false; }

  panel.addEventListener("pointermove", onMove, { passive: true });
  panel.addEventListener("pointerleave", onLeave, { passive: true });

  // ---- resize (debounced) ----
  let rz = 0;
  const ro = new ResizeObserver(() => {
    clearTimeout(rz);
    rz = setTimeout(() => { build(); if (reduce.matches) start(); }, 120);
  });
  ro.observe(panel);

  // pause when tab hidden, respect reduced-motion changes
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else start();
  });
  reduce.addEventListener?.("change", start);

  build();
  start();

  /* ---------------- form behaviour ---------------- */
  const pw = document.getElementById("password");
  const pwToggle = document.getElementById("pwToggle");
  pwToggle.addEventListener("click", () => {
    const showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    pwToggle.textContent = showing ? "Show" : "Hide";
    pwToggle.setAttribute("aria-pressed", String(!showing));
    pw.focus({ preventScroll: true });
  });

  const form = document.getElementById("signin");
  const submit = document.getElementById("submit");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (submit.getAttribute("aria-busy") === "true") return;
    submit.setAttribute("aria-busy", "true");
    submit.textContent = "Signing in…";
    setTimeout(() => {
      submit.removeAttribute("aria-busy");
      submit.textContent = "Sign in";
    }, 1400);
  });

  document.getElementById("sso").addEventListener("click", () => {
    const b = document.getElementById("sso");
    const label = b.lastChild;
    label.textContent = " Redirecting…";
    setTimeout(() => { label.textContent = " Sign in with agency SSO"; }, 1400);
  });

  document.getElementById("forgot").addEventListener("click", (e) => e.preventDefault());
})();
</script>
</body>
</html>
