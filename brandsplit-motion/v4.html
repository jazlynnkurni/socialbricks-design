<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Fostr</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="split.css" />
<style>
  /* ============================================================
     >>> MOTION CSS ONLY — "LIVING ROOTS / VEINS"
     A sparse organic network of fine roots that slowly grows
     across the panel, then idles with a gentle breathing pulse
     and a slow travelling glow of "sap" along the strands.
     Low-contrast whites/teals; wordmark + line stay legible.
     ============================================================ */
  .brand .motion { background: transparent; }

  /* soft ambient depth behind the roots — very low contrast */
  .brand .motion::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 18% -10%, color-mix(in srgb, #eafaf7 12%, transparent) 0%, transparent 55%),
      radial-gradient(120% 100% at 90% 115%, color-mix(in srgb, var(--teal-deep) 40%, transparent) 0%, transparent 60%);
    opacity: .7;
  }

  .brand .motion canvas.roots {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    /* nothing to freeze in CSS — the script paints one static grown frame */
    .brand .motion::before { opacity: .7; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="motion" aria-hidden="true">
        <!-- >>> MOTION MARKUP HERE (canvas / svg / divs) <<< -->
        <canvas class="roots"></canvas>
      </div>
      <div class="brand__top"><img src="fostr-wordmark-white.png" alt="Fostr" /></div>
      <div class="brand__body">
        <p class="brand__line">The paperwork stays here, so more of your day can reach a kid.</p>
        <p class="brand__sub">Your notes, your visits, your record — kept in one place that holds up when it matters.</p>
      </div>
    </section>

    <section class="signin">
      <div class="formWrap">
        <div class="signinBrand"><img src="fostr-wordmark-black.png" alt="Fostr" /></div>
        <h1>Sign in</h1>
        <p class="hint">Use the account your agency set up for you.</p>
        <form id="loginForm" class="stack" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="j.rivera" />
          </div>
          <div class="field">
            <div class="labelRow">
              <label for="password">Password</label>
              <a class="link" href="#" id="forgot">Forgot password?</a>
            </div>
            <div class="pwWrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="pwToggle" id="pwToggle" aria-pressed="false" aria-controls="password">Show</button>
            </div>
          </div>
          <label class="remember" for="remember">
            <input type="checkbox" id="remember" name="remember" checked />
            <span>Keep me signed in</span>
          </label>
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="spin" aria-hidden="true"></span><span id="submitLabel">Sign in</span>
          </button>
          <div class="or">or</div>
          <button type="button" class="btn-ghost" id="ssoBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8" />
              <path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Sign in with agency SSO
          </button>
        </form>
        <p class="support">Trouble signing in? Ask your agency admin.</p>
      </div>
    </section>
  </main>

  <script src="split.js"></script>
  <script>
    /* ============================================================
       >>> MOTION SCRIPT ONLY — "LIVING ROOTS / VEINS"
       Self-contained IIFE. Canvas stroke-draw of a sparse root
       network that grows in, then breathes and carries a slow
       "sap" glow. Single rAF (~35fps cap), pauses when hidden /
       off-screen. Reduced motion → one static grown frame.
       ============================================================ */
    (function () {
      var section = document.querySelector(".brand");
      var motion = section && section.querySelector(".motion");
      var canvas = motion && motion.querySelector("canvas.roots");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;

      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---- deterministic RNG (stable, elegant layout) ----
      function makeRng(seed) {
        var s = seed >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      // ---- geometry, in normalized [0..1] space (regen-free on resize) ----
      var strands = [];

      function buildStrand(x, y, ang, len, depth, rng) {
        var pts = [{ x: x, y: y }];
        var cx = x, cy = y, a = ang;
        var steps = Math.max(7, Math.round(len * 46));
        var seg = len / steps;
        for (var i = 0; i < steps; i++) {
          // gentle meander + slight downward/gravity drift
          a += (rng() - 0.5) * 0.42;
          a += (Math.PI / 2 - a) * 0.05;
          cx += Math.cos(a) * seg;
          cy += Math.sin(a) * seg;
          pts.push({ x: cx, y: cy });
          // sparse branching
          if (depth < 2 && i > 3 && i < steps - 2 && rng() < 0.09) {
            var side = rng() < 0.5 ? -1 : 1;
            buildStrand(cx, cy, a + side * (0.5 + rng() * 0.5), len * (0.38 + rng() * 0.3), depth + 1, rng);
          }
        }
        // cumulative arc-length
        var cum = [0];
        for (var j = 1; j < pts.length; j++) {
          var dx = pts[j].x - pts[j - 1].x, dy = pts[j].y - pts[j - 1].y;
          cum[j] = cum[j - 1] + Math.sqrt(dx * dx + dy * dy);
        }
        var total = cum[cum.length - 1] || 0.0001;
        // sequential draw scheduling: deeper + later origins draw a touch later
        var delay = depth * 0.5 + rng() * 0.35;
        strands.push({
          pts: pts, cum: cum, total: total, depth: depth,
          delay: delay, dur: 1.5 + depth * 0.35,
          sapPhase: rng(), sapSpeed: 0.06 + rng() * 0.05
        });
      }

      function buildAll() {
        strands = [];
        var rng = makeRng(20240817);
        // a few origin seeds spread across the top, leaning outward like roots
        var origins = [0.10, 0.30, 0.48, 0.66, 0.84, 0.94];
        for (var k = 0; k < origins.length; k++) {
          var ox = origins[k];
          var lean = (ox - 0.5) * 0.7;                 // outward bias by position
          var ang = Math.PI / 2 + lean + (rng() - 0.5) * 0.2; // mostly downward
          var len = 0.72 + rng() * 0.28;
          buildStrand(ox, -0.03, ang, len, 0, rng);
        }
        // order so trunks reveal before their branches
        strands.sort(function (a, b) { return a.depth - b.depth; });
      }
      buildAll();

      // ---- canvas sizing ----
      var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        var r = motion.getBoundingClientRect();
        W = Math.max(1, r.width);
        H = Math.max(1, r.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (reduce || !running) draw(lastT); // repaint static frame on resize
      }

      // ---- drawing helpers ----
      function pointAt(s, L) {
        var cum = s.cum, pts = s.pts;
        if (L <= 0) return { x: pts[0].x, y: pts[0].y, i: 0 };
        for (var i = 1; i < cum.length; i++) {
          if (cum[i] >= L) {
            var t = (L - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
            return {
              x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t,
              y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t,
              i: i
            };
          }
        }
        var last = pts[pts.length - 1];
        return { x: last.x, y: last.y, i: pts.length - 1 };
      }

      function strokeUpTo(s, L, w, alpha) {
        var cum = s.cum, pts = s.pts;
        ctx.lineWidth = w;
        ctx.strokeStyle = "rgba(255,255,255," + alpha + ")";
        ctx.beginPath();
        ctx.moveTo(pts[0].x * W, pts[0].y * H);
        for (var i = 1; i < pts.length; i++) {
          if (cum[i] <= L) {
            ctx.lineTo(pts[i].x * W, pts[i].y * H);
          } else {
            var p = pointAt(s, L);
            ctx.lineTo(p.x * W, p.y * H);
            break;
          }
        }
        ctx.stroke();
      }

      // ---- main render ----
      var start = 0, lastT = 0, running = false, rafId = 0;
      var FRAME = 1000 / 35, prevFrame = 0;

      function draw(now) {
        if (!start) start = now;
        var elapsed = (now - start) / 1000;
        lastT = now;

        ctx.clearRect(0, 0, W, H);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // gentle breathing of the whole network
        var breathe = reduce ? 1 : 0.90 + Math.sin(elapsed * 0.9) * 0.10;

        for (var i = 0; i < strands.length; i++) {
          var s = strands[i];
          var grow = reduce ? 1 : Math.min(1, Math.max(0, (elapsed - s.delay) / s.dur));
          // ease-out for a natural "drawing in"
          grow = 1 - Math.pow(1 - grow, 2.2);
          if (grow <= 0) continue;

          var L = s.total * grow;
          var depthFade = s.depth === 0 ? 1 : (s.depth === 1 ? 0.72 : 0.5);
          var baseW = (s.depth === 0 ? 1.6 : s.depth === 1 ? 1.15 : 0.8);
          var baseAlpha = (0.13 * depthFade) * breathe;

          // faint teal underglow (soft, wide) then the crisp white strand
          strokeUpTo(s, L, baseW + 2.4, 0.05 * depthFade * breathe);
          strokeUpTo(s, L, baseW, baseAlpha + 0.03);

          // travelling "sap" highlight once the strand has drawn in
          if (!reduce && grow > 0.98) {
            var t = (s.sapPhase + elapsed * s.sapSpeed) % 1;
            var sapL = s.total * t;
            var p = pointAt(s, sapL);
            var px = p.x * W, py = p.y * H;
            // short bright segment trailing the sap point
            var back = pointAt(s, Math.max(0, sapL - s.total * 0.06));
            var g = ctx.createLinearGradient(back.x * W, back.y * H, px, py);
            g.addColorStop(0, "rgba(220,246,242,0)");
            g.addColorStop(1, "rgba(224,248,244," + (0.42 * breathe) + ")");
            ctx.strokeStyle = g;
            ctx.lineWidth = baseW + 0.4;
            ctx.beginPath();
            ctx.moveTo(back.x * W, back.y * H);
            ctx.lineTo(px, py);
            ctx.stroke();
            // soft node glow
            var rg = ctx.createRadialGradient(px, py, 0, px, py, 7);
            rg.addColorStop(0, "rgba(228,250,246," + (0.5 * breathe) + ")");
            rg.addColorStop(1, "rgba(228,250,246,0)");
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(px, py, 7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function loop(now) {
        if (!running) return;
        rafId = requestAnimationFrame(loop);
        if (now - prevFrame < FRAME) return;
        prevFrame = now;
        draw(now);
      }

      function play() {
        if (running || reduce) return;
        running = true;
        prevFrame = 0;
        rafId = requestAnimationFrame(loop);
      }
      function pause() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
      }

      // ---- lifecycle: pause when hidden or off-screen ----
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) pause(); else play();
      });

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) play(); else pause();
        }, { threshold: 0.01 }).observe(motion);
      }

      if ("ResizeObserver" in window) {
        new ResizeObserver(function () { resize(); }).observe(motion);
      } else {
        window.addEventListener("resize", resize);
      }

      resize();
      if (reduce) {
        draw(0); // one static, fully-grown frame
      } else {
        play();
      }
    })();
  </script>
</body>
</html>
