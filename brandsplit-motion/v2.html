<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Fostr</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="split.css" />
<style>
  /* ============================================================
     >>> MOTION CSS ONLY — style your .brand .motion layer here.
     Do not restyle the form/layout (that lives in split.css).
     Keep it low-contrast (whites/teals) so the wordmark + line
     stay perfectly legible on top. Freeze under reduced-motion.

     PATTERN: "Morphing Mesh Blobs" — a few big, soft teal/white
     radial blobs painted to a low-res canvas, then melted together
     with a heavy CSS blur so their edges merge like a lava-lamp.
     ============================================================ */
  .brand .motion { background: linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 82%); }

  #meshCanvas {
    position: absolute;
    /* over-size + negative inset so the blur never reveals a hard edge */
    inset: -14%;
    width: 128%;
    height: 128%;
    display: block;
    /* heavy blur = gooey metaball merge; saturate keeps teals rich but gentle */
    filter: blur(34px) saturate(1.1);
    opacity: 1;
    will-change: transform;
  }

  /* a whisper-soft vignette to seat the wordmark + line on top */
  .motion__veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 30% 18%, transparent 48%, rgba(15,48,46,0.12) 100%),
      linear-gradient(180deg, rgba(15,48,46,0.05) 0%, transparent 30%, transparent 74%, rgba(15,48,46,0.08) 100%);
    mix-blend-mode: multiply;
  }

  @media (prefers-reduced-motion: reduce) {
    #meshCanvas { filter: blur(48px) saturate(1.04); }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="motion" aria-hidden="true">
        <!-- >>> MOTION MARKUP HERE (canvas / svg / divs) <<< -->
        <canvas id="meshCanvas"></canvas>
        <div class="motion__veil"></div>
      </div>
      <div class="brand__top"><img src="fostr-wordmark-white.png" alt="Fostr" /></div>
      <div class="brand__body">
        <p class="brand__line">The paperwork stays here, so more of your day can reach a kid.</p>
        <p class="brand__sub">Your notes, your visits, your record — kept in one place that holds up when it matters.</p>
      </div>
    </section>

    <section class="signin">
      <div class="formWrap">
        <div class="signinBrand"><img src="fostr-wordmark-black.png" alt="Fostr" /></div>
        <h1>Sign in</h1>
        <p class="hint">Use the account your agency set up for you.</p>
        <form id="loginForm" class="stack" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="j.rivera" />
          </div>
          <div class="field">
            <div class="labelRow">
              <label for="password">Password</label>
              <a class="link" href="#" id="forgot">Forgot password?</a>
            </div>
            <div class="pwWrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="pwToggle" id="pwToggle" aria-pressed="false" aria-controls="password">Show</button>
            </div>
          </div>
          <label class="remember" for="remember">
            <input type="checkbox" id="remember" name="remember" checked />
            <span>Keep me signed in</span>
          </label>
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="spin" aria-hidden="true"></span><span id="submitLabel">Sign in</span>
          </button>
          <div class="or">or</div>
          <button type="button" class="btn-ghost" id="ssoBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8" />
              <path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Sign in with agency SSO
          </button>
        </form>
        <p class="support">Trouble signing in? Ask your agency admin.</p>
      </div>
    </section>
  </main>

  <script src="split.js"></script>
  <script>
    /* ============================================================
       >>> MOTION SCRIPT ONLY — self-contained IIFE. Drive your
       .brand .motion animation here. rAF-capped, pause when the
       tab is hidden, and render a single static frame when
       matchMedia('(prefers-reduced-motion: reduce)').matches.
       ============================================================ */
    (function () {
      var canvas = document.getElementById("meshCanvas");
      var panel = document.querySelector(".brand");
      if (!canvas || !panel) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;

      var reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");

      // Low-contrast teal/white palette so the wordmark + line stay legible.
      // Each blob: normalized home position, radius, colour, and slow drift.
      var BLOBS = [
        { hx: 0.26, hy: 0.30, r: 0.62, col: [158, 216, 208], a: 0.62, ax: 0.12, ay: 0.10, fx: 0.055, fy: 0.041, px: 0.0, py: 1.7 },
        { hx: 0.74, hy: 0.24, r: 0.52, col: [238, 250, 247], a: 0.52, ax: 0.10, ay: 0.13, fx: 0.043, fy: 0.061, px: 2.1, py: 0.6 },
        { hx: 0.62, hy: 0.72, r: 0.66, col: [ 88, 154, 147], a: 0.52, ax: 0.14, ay: 0.09, fx: 0.037, fy: 0.049, px: 4.2, py: 3.1 },
        { hx: 0.20, hy: 0.80, r: 0.50, col: [142, 208, 199], a: 0.58, ax: 0.11, ay: 0.12, fx: 0.061, fy: 0.033, px: 1.2, py: 5.0 },
        { hx: 0.50, hy: 0.46, r: 0.44, col: [228, 246, 242], a: 0.48, ax: 0.15, ay: 0.11, fx: 0.048, fy: 0.057, px: 3.3, py: 2.4 }
      ];

      var RES = 0.42;         // internal render scale — cheap, blur hides it
      var W = 1, H = 1, minDim = 1;

      function resize() {
        var w = Math.max(1, Math.round(panel.clientWidth * 1.28));
        var h = Math.max(1, Math.round(panel.clientHeight * 1.28));
        W = Math.max(1, Math.round(w * RES));
        H = Math.max(1, Math.round(h * RES));
        canvas.width = W;
        canvas.height = H;
        minDim = Math.min(W, H);
      }

      function draw(tSec) {
        // Base wash under the blobs (matches the panel gradient tone).
        ctx.globalCompositeOperation = "source-over";
        var base = ctx.createLinearGradient(0, 0, W * 0.4, H);
        base.addColorStop(0, "#3d8b88");
        base.addColorStop(1, "#2a6a68");
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, W, H);

        // Blobs knead across the panel on slow, offset sine paths so they
        // drift, overlap (merge) and pull apart (split) over time.
        for (var i = 0; i < BLOBS.length; i++) {
          var b = BLOBS[i];
          var cx = (b.hx + b.ax * Math.sin(tSec * b.fx * 6.2831 + b.px)) * W;
          var cy = (b.hy + b.ay * Math.sin(tSec * b.fy * 6.2831 + b.py)) * H;
          var pulse = 1 + 0.10 * Math.sin(tSec * (b.fx + b.fy) * 3.1 + b.px + b.py);
          var rad = b.r * minDim * pulse;

          var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
          var c = b.col;
          g.addColorStop(0, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + b.a + ")");
          g.addColorStop(0.55, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (b.a * 0.4).toFixed(3) + ")");
          g.addColorStop(1, "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }
      }

      // ---- reduced motion: one static frame, no loop ----
      if (reduceMQ.matches) {
        resize();
        draw(6.0);
        return;
      }

      // ---- animated: single rAF, capped ~34fps, paused when hidden ----
      var FRAME = 1000 / 34;
      var last = 0;
      var running = true;
      var rafId = 0;

      function loop(now) {
        rafId = requestAnimationFrame(loop);
        if (!running) return;
        if (now - last < FRAME) return;
        last = now;
        draw(now / 1000);
      }

      function start() {
        if (rafId) return;
        last = 0;
        rafId = requestAnimationFrame(loop);
      }
      function stop() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      }

      // Pause when the tab is hidden or the panel scrolls out of view.
      document.addEventListener("visibilitychange", function () {
        running = !document.hidden;
        if (running) start(); else stop();
      });

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          var vis = entries[0].isIntersecting;
          running = vis && !document.hidden;
          if (running) start(); else { stop(); }
        }, { threshold: 0.01 }).observe(panel);
      }

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(resize, 150);
      });

      resize();
      start();
    })();
  </script>
</body>
</html>
