<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Fostr</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="split.css" />
<style>
  /* ============================================================
     >>> MOTION CSS ONLY — "AURORA RIBBONS"
     Undulating curtains of lighter teal + white that wave slowly
     behind the wordmark, like northern lights / blown silk.
     Low-contrast, additive (screen), heavily blurred so the
     wordmark + line stay perfectly legible on top.
     ============================================================ */
  .brand .motion .aurora {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    isolation: isolate;            /* ribbons blend with each other, not the form */
  }
  /* a faint teal-deep wash to seat the ribbons and hold contrast down */
  .brand .motion::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 22% 12%,
                  color-mix(in srgb, var(--teal) 40%, transparent) 0%,
                  transparent 60%);
    mix-blend-mode: screen; opacity: .5; pointer-events: none;
  }
  .brand .motion .ribbon { mix-blend-mode: screen; }

  @media (prefers-reduced-motion: reduce) {
    /* one static, gently-waved frame — no animation loop runs */
    .brand .motion .aurora { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="motion" aria-hidden="true">
        <!-- >>> MOTION MARKUP — Aurora Ribbons <<< -->
        <svg class="aurora" viewBox="0 0 1000 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="auroraBlur" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
              <feGaussianBlur stdDeviation="30" />
            </filter>
            <!-- vertical fade so each curtain reads as a shaft of light -->
            <linearGradient id="rbWhite" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0"   stop-color="#ffffff" stop-opacity="0" />
              <stop offset="0.42" stop-color="#f4fbfa" stop-opacity="0.55" />
              <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.62" />
              <stop offset="1"   stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="rbTeal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0"   stop-color="#7fcac6" stop-opacity="0" />
              <stop offset="0.5" stop-color="#9fe0dc" stop-opacity="0.5" />
              <stop offset="0.8" stop-color="#c8f2ef" stop-opacity="0.4" />
              <stop offset="1"   stop-color="#7fcac6" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g filter="url(#auroraBlur)">
            <path class="ribbon" fill="url(#rbWhite)" d="" />
            <path class="ribbon" fill="url(#rbTeal)"  d="" />
            <path class="ribbon" fill="url(#rbWhite)" d="" />
            <path class="ribbon" fill="url(#rbTeal)"  d="" />
            <path class="ribbon" fill="url(#rbWhite)" d="" />
          </g>
        </svg>
      </div>
      <div class="brand__top"><img src="fostr-wordmark-white.png" alt="Fostr" /></div>
      <div class="brand__body">
        <p class="brand__line">The paperwork stays here, so more of your day can reach a kid.</p>
        <p class="brand__sub">Your notes, your visits, your record — kept in one place that holds up when it matters.</p>
      </div>
    </section>

    <section class="signin">
      <div class="formWrap">
        <div class="signinBrand"><img src="fostr-wordmark-black.png" alt="Fostr" /></div>
        <h1>Sign in</h1>
        <p class="hint">Use the account your agency set up for you.</p>
        <form id="loginForm" class="stack" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="j.rivera" />
          </div>
          <div class="field">
            <div class="labelRow">
              <label for="password">Password</label>
              <a class="link" href="#" id="forgot">Forgot password?</a>
            </div>
            <div class="pwWrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="pwToggle" id="pwToggle" aria-pressed="false" aria-controls="password">Show</button>
            </div>
          </div>
          <label class="remember" for="remember">
            <input type="checkbox" id="remember" name="remember" checked />
            <span>Keep me signed in</span>
          </label>
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="spin" aria-hidden="true"></span><span id="submitLabel">Sign in</span>
          </button>
          <div class="or">or</div>
          <button type="button" class="btn-ghost" id="ssoBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8" />
              <path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Sign in with agency SSO
          </button>
        </form>
        <p class="support">Trouble signing in? Ask your agency admin.</p>
      </div>
    </section>
  </main>

  <script src="split.js"></script>
  <script>
    /* ============================================================
       >>> MOTION SCRIPT — Aurora Ribbons (self-contained IIFE)
       Sine-driven vertical curtains whose waveforms slowly drift,
       redrawn on a single rAF capped to ~33fps. Pauses when the
       tab is hidden; renders one static frame under reduced-motion.
       ============================================================ */
    (function () {
      var svg = document.querySelector('.brand .motion .aurora');
      if (!svg) return;
      var paths = Array.prototype.slice.call(svg.querySelectorAll('.ribbon'));
      if (!paths.length) return;

      var TAU = Math.PI * 2;
      var H = 1000, W = 1000, STEPS = 20;

      // Each ribbon: base X, two overlapping sine components (amp / spatial freq /
      // temporal speed / phase) + a half-width. Speeds are tiny → calm, living drift.
      var ribbons = [
        { base: 175, amp: 70, k: 1.05, sp:  0.15, ph: 0.0, amp2: 34, k2: 2.3, sp2:  0.10, w: 150 },
        { base: 350, amp: 92, k: 0.90, sp: -0.13, ph: 1.2, amp2: 40, k2: 1.8, sp2:  0.09, w: 195 },
        { base: 520, amp: 80, k: 1.20, sp:  0.11, ph: 2.4, amp2: 38, k2: 2.1, sp2: -0.12, w: 210 },
        { base: 690, amp: 96, k: 0.82, sp: -0.16, ph: 3.1, amp2: 44, k2: 1.6, sp2:  0.08, w: 185 },
        { base: 852, amp: 74, k: 1.08, sp:  0.12, ph: 4.0, amp2: 30, k2: 2.5, sp2:  0.14, w: 160 }
      ];

      function centerX(r, y, t) {
        var u = y / H;
        return r.base
          + r.amp  * Math.sin(r.k  * u * TAU + r.sp  * t + r.ph)
          + r.amp2 * Math.sin(r.k2 * u * TAU - r.sp2 * t + r.ph * 1.7);
      }

      function buildPath(r, t) {
        var d = '', y, cx, i;
        // down the left edge
        for (i = 0; i <= STEPS; i++) {
          y = (i / STEPS) * H;
          cx = centerX(r, y, t) - r.w * 0.5;
          d += (i === 0 ? 'M' : 'L') + cx.toFixed(1) + ' ' + y.toFixed(1) + ' ';
        }
        // up the right edge
        for (i = STEPS; i >= 0; i--) {
          y = (i / STEPS) * H;
          cx = centerX(r, y, t) + r.w * 0.5;
          d += 'L' + cx.toFixed(1) + ' ' + y.toFixed(1) + ' ';
        }
        return d + 'Z';
      }

      function render(t) {
        for (var i = 0; i < ribbons.length; i++) {
          paths[i].setAttribute('d', buildPath(ribbons[i], t));
        }
      }

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reduce && reduce.matches) { render(6.0); return; } // single static, pleasantly-waved frame

      var FPS = 33, MIN_DT = 1000 / FPS;
      var last = 0, raf = 0, running = false, start = performance.now();

      function loop(now) {
        if (!running) return;
        if (now - last >= MIN_DT) { last = now; render((now - start) / 1000); }
        raf = requestAnimationFrame(loop);
      }
      function play() { if (!running) { running = true; last = 0; raf = requestAnimationFrame(loop); } }
      function pause() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) pause(); else play();
      });

      render(0);
      play();
    })();
  </script>
</body>
</html>
