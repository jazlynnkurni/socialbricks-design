<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fostr Sidebar — v2 Active Blob (magic-move)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---- v2: layout + motion only. Brand/base comes from tokens.css ---- */
  :root {
    --rail-w: 264px;
    --rail-w-collapsed: 76px;
    --ease: cubic-bezier(.22, .61, .36, 1);        /* calm settle */
    --ease-blob: cubic-bezier(.34, 1.2, .38, 1);    /* buttery glide, tiny overshoot */
  }

  .app {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  /* ============ SIDEBAR ============ */
  .rail {
    position: relative;
    flex: 0 0 auto;
    width: var(--rail-w);
    background: var(--paper);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 18px 14px 14px;
    transition: width .42s var(--ease);
    will-change: width;
  }
  .rail.collapsed { width: var(--rail-w-collapsed); }

  /* --- brand row --- */
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 2px 8px 4px;
    min-height: 44px;
  }
  .brand img.mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    flex: 0 0 auto;
    box-shadow: 0 1px 3px rgba(31,39,37,.12);
  }
  .brand img.wordmark {
    height: 19px;
    width: auto;
    opacity: .92;
    transition: opacity .28s var(--ease), transform .28s var(--ease);
  }
  .rail.collapsed .brand img.wordmark { opacity: 0; transform: translateX(-6px); pointer-events: none; }

  /* --- collapse toggle --- */
  .toggle {
    position: absolute;
    top: 26px;
    right: -13px;
    z-index: 5;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(31,39,37,.08);
    transition: color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .toggle:hover { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 40%, var(--line)); box-shadow: 0 2px 8px rgba(61,139,136,.16); }
  .toggle svg { transition: transform .42s var(--ease); }
  .rail.collapsed .toggle svg { transform: rotate(180deg); }

  /* --- scroll region holding groups + the gliding blob --- */
  .nav {
    position: relative;
    margin-top: 14px;
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 8px;
  }

  /* THE signature element: one pill that magic-moves between items */
  .blob {
    position: absolute;
    left: 0;
    top: 0;
    height: 0;
    width: 100%;
    border-radius: 12px;
    background: var(--teal-tint);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 16%, transparent);
    pointer-events: none;
    z-index: 0;
    /* transform is what we animate (FLIP). height/width snap, transform glides. */
    transition: transform .5s var(--ease-blob), width .42s var(--ease);
    will-change: transform;
  }
  /* a whisper-thin teal edge marker riding the leading side of the pill */
  .blob::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    height: 17px;
    width: 3px;
    border-radius: 3px;
    background: var(--teal);
    transform: translateY(-50%) scaleY(.4);
    opacity: 0;
    transition: opacity .34s var(--ease) .06s, transform .4s var(--ease-blob) .04s;
  }
  .blob.settled::before { opacity: 1; transform: translateY(-50%) scaleY(1); }

  .group { margin: 2px 0 8px; }
  .group-label {
    padding: 12px 12px 6px;
    transition: opacity .24s var(--ease);
  }
  .rail.collapsed .group-label { opacity: 0; }
  /* keep a faint divider tick where the label was, when collapsed */
  .rail.collapsed .group { position: relative; }
  .rail.collapsed .group + .group::before {
    content: "";
    display: block;
    height: 1px;
    background: var(--line-2);
    margin: 4px 12px 8px;
  }

  /* --- nav item --- */
  .item {
    position: relative;
    z-index: 1;               /* above the blob */
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: var(--tap);
    padding: 10px 12px;
    border: 0;
    background: transparent;
    border-radius: 12px;
    color: var(--ink-2);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    transition: color .28s var(--ease);
  }
  .item .ico {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    transition: color .28s var(--ease), transform .42s var(--ease-blob);
  }
  .item .ico svg { width: 20px; height: 20px; display: block; }
  .item .label {
    font-size: .905rem;
    font-weight: 500;
    letter-spacing: -.006em;
    transition: opacity .26s var(--ease), transform .3s var(--ease), font-weight .2s var(--ease), color .28s var(--ease);
  }
  .rail.collapsed .item .label { opacity: 0; transform: translateX(-8px); }

  /* hover — only for non-active items (calm, no competing fill) */
  .item:not(.active):hover { color: var(--ink); }
  .item:not(.active):hover .ico { color: var(--teal); transform: translateX(1px); }

  /* active state — driven by class; color/weight only (bg is the blob) */
  .item.active { color: var(--teal-deep); }
  .item.active .ico { color: var(--teal); }
  .item.active .label { font-weight: 600; color: var(--teal-deep); }

  /* the scale-pop the freshly-activated icon does */
  @keyframes iconPop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .item.pop .ico { animation: iconPop .44s var(--ease-blob); }

  /* --- footer --- */
  .foot {
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .avatar {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--teal-tint);
    color: var(--teal-deep);
    font-weight: 600;
    font-size: .82rem;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 18%, transparent);
  }
  .who {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    transition: opacity .26s var(--ease), transform .26s var(--ease);
  }
  .rail.collapsed .who,
  .rail.collapsed .logout { opacity: 0; transform: translateX(-6px); pointer-events: none; }
  .who .name { font-size: .87rem; font-weight: 600; color: var(--ink); line-height: 1.25; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .who .role { font-size: .74rem; color: var(--ink-3); white-space: nowrap; }
  .logout {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border: 0; background: transparent; border-radius: 9px;
    color: var(--ink-3); cursor: pointer; display: grid; place-items: center;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .logout:hover { color: var(--teal-deep); background: var(--teal-tint); }

  /* ============ CONTENT FRAME ============ */
  .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 66px;
    flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 86%, transparent);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 28px;
  }
  .crumb { font-size: .78rem; color: var(--ink-3); }
  .crumb b { color: var(--ink-2); font-weight: 600; }
  .canvas { flex: 1 1 auto; overflow: auto; padding: 34px 40px; }
  .page-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .page-head h1 { margin: 0; font-size: 1.62rem; letter-spacing: -.02em; color: var(--ink); font-weight: 700; }
  .page-head .sub { font-size: .9rem; color: var(--ink-2); }
  .placeholder {
    border: 1px dashed var(--line);
    border-radius: 16px;
    background: color-mix(in srgb, var(--paper) 60%, transparent);
    min-height: 320px;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    font-size: .92rem;
    max-width: 880px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="rail" id="rail" aria-label="Primary">
    <button class="toggle" id="toggle" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <div class="brand">
      <img class="mark" src="fostr-logo.svg" alt="Fostr">
      <img class="wordmark" src="fostr-wordmark-black.png" alt="Fostr">
    </div>

    <nav class="nav" id="nav">
      <div class="blob" id="blob" aria-hidden="true"></div>

      <div class="group">
        <div class="group-label eyebrow">Daily work</div>
        <button class="item" data-key="dashboard" title="Dashboard">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="label">Dashboard</span>
        </button>
      </div>

      <div class="group">
        <div class="group-label eyebrow">Case work</div>
        <button class="item active" data-key="fieldbook" title="Fieldbook" aria-current="page">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4a2 2 0 0 1-2-2z"/><path d="M15.5 3a2.5 2.5 0 0 1 3.5 3.5L14 12l-4 1 1-4z"/></svg></span>
          <span class="label">Fieldbook</span>
        </button>
        <button class="item" data-key="review" title="Review queue">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="m9 14 2 2 4-4"/></svg></span>
          <span class="label">Review queue</span>
        </button>
        <button class="item" data-key="search" title="Search case history">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
          <span class="label">Search case history</span>
        </button>
      </div>

      <div class="group">
        <div class="group-label eyebrow">Court-ready</div>
        <button class="item" data-key="verify" title="Verify a seal">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span class="label">Verify a seal</span>
        </button>
      </div>

      <div class="group">
        <div class="group-label eyebrow">Reports</div>
        <button class="item" data-key="reporting" title="Reporting">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><rect x="7" y="12" width="3" height="5" rx=".6"/><rect x="12.5" y="8" width="3" height="9" rx=".6"/><rect x="18" y="5" width="3" height="12" rx=".6"/></svg></span>
          <span class="label">Reporting</span>
        </button>
        <button class="item" data-key="exports" title="Exports">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg></span>
          <span class="label">Exports</span>
        </button>
      </div>
    </nav>

    <div class="foot">
      <div class="avatar" aria-hidden="true">JH</div>
      <div class="who">
        <div class="name">Jaden Hinton</div>
        <div class="role">Caseworker</div>
      </div>
      <button class="logout" title="Log out" aria-label="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <!-- ===================== CONTENT ===================== -->
  <main class="content">
    <header class="topbar">
      <div class="crumb">Cases <b id="crumb">/ Fieldbook</b></div>
    </header>
    <section class="canvas dotgrid">
      <div class="page-head">
        <h1 id="pageTitle">Fieldbook</h1>
        <span class="sub" id="pageSub">Your working notebook across open cases</span>
      </div>
      <div class="placeholder">Content area — the sidebar is the focus of this variant.</div>
    </section>
  </main>
</div>

<script>
(function () {
  var rail   = document.getElementById('rail');
  var nav    = document.getElementById('nav');
  var blob   = document.getElementById('blob');
  var toggle = document.getElementById('toggle');
  var items  = Array.prototype.slice.call(nav.querySelectorAll('.item'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var META = {
    dashboard: ['Dashboard',           'Today across your caseload'],
    fieldbook: ['Fieldbook',           'Your working notebook across open cases'],
    review:    ['Review queue',        'Notes waiting on your sign-off'],
    search:    ['Search case history', 'Find anything filed on a case'],
    verify:    ['Verify a seal',       'Confirm a court-ready document is authentic'],
    reporting: ['Reporting',           'Outcomes and activity, at a glance'],
    exports:   ['Exports',             'Pull records out for court or audit']
  };

  var current = nav.querySelector('.item.active') || items[0];

  // Place the blob exactly over an item (no animation) — used on init + resize.
  function snapTo(el) {
    blob.style.transition = 'none';
    blob.style.transform  = 'translateY(' + el.offsetTop + 'px)';
    blob.style.height     = el.offsetHeight + 'px';
    // force reflow so the killed transition doesn't bleed into the next move
    void blob.offsetWidth;
    blob.style.transition = '';
    blob.classList.add('settled');
  }

  // FLIP magic-move: glide the single pill from `current` to `next`.
  function moveTo(next) {
    if (next === current) return;

    if (reduce) {
      current.classList.remove('active');
      current.removeAttribute('aria-current');
      next.classList.add('active');
      next.setAttribute('aria-current', 'page');
      snapTo(next);
      current = next;
      updateFrame(next);
      return;
    }

    var firstTop = current.offsetTop;      // FIRST — where the pill is now
    var lastTop  = next.offsetTop;         // LAST  — where it must land
    var lastH    = next.offsetHeight;
    var delta    = firstTop - lastTop;

    // swap the highlight-edge off during the glide, so it re-blooms on arrival
    blob.classList.remove('settled');

    // LAST: commit final geometry with transition disabled...
    blob.style.transition = 'none';
    blob.style.height     = lastH + 'px';
    blob.style.transform  = 'translateY(' + lastTop + 'px)';
    // INVERT: instantly offset back to where it was
    void blob.offsetWidth;
    blob.style.transform  = 'translateY(' + lastTop + 'px) translateY(' + delta + 'px)';

    // PLAY: re-enable transition and release to the real position
    void blob.offsetWidth;
    blob.style.transition = '';
    requestAnimationFrame(function () {
      blob.style.transform = 'translateY(' + lastTop + 'px)';
    });

    // when the glide arrives, bloom the edge marker
    var onEnd = function (e) {
      if (e.propertyName === 'transform') {
        blob.classList.add('settled');
        blob.removeEventListener('transitionend', onEnd);
      }
    };
    blob.addEventListener('transitionend', onEnd);

    // text state
    current.classList.remove('active');
    current.removeAttribute('aria-current');
    next.classList.add('active');
    next.setAttribute('aria-current', 'page');

    // icon scale-pop on the newly active item
    next.classList.remove('pop');
    void next.offsetWidth;
    next.classList.add('pop');

    current = next;
    updateFrame(next);
  }

  function updateFrame(el) {
    var m = META[el.dataset.key];
    if (!m) return;
    document.getElementById('pageTitle').textContent = m[0];
    document.getElementById('pageSub').textContent   = m[1];
    document.getElementById('crumb').textContent     = '/ ' + m[0];
  }

  items.forEach(function (el) {
    el.addEventListener('click', function () { moveTo(el); });
  });

  // Collapse / expand — the pill re-snaps to the active item after width settles.
  toggle.addEventListener('click', function () {
    var collapsing = !rail.classList.contains('collapsed');
    rail.classList.toggle('collapsed', collapsing);
    toggle.setAttribute('aria-expanded', String(!collapsing));
    toggle.setAttribute('aria-label', collapsing ? 'Expand sidebar' : 'Collapse sidebar');
    toggle.setAttribute('title', collapsing ? 'Expand sidebar' : 'Collapse sidebar');
    if (reduce) { snapTo(current); return; }
    // keep the pill glued to the active row through the width animation
    var t0 = performance.now();
    (function follow(now) {
      blob.style.transition = 'none';
      blob.style.transform  = 'translateY(' + current.offsetTop + 'px)';
      blob.style.height     = current.offsetHeight + 'px';
      void blob.offsetWidth;
      blob.style.transition = '';
      if (now - t0 < 460) requestAnimationFrame(follow);
    })(performance.now());
  });

  // init + keep aligned on resize
  function init() { snapTo(current); updateFrame(current); }
  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { snapTo(current); }, 120);
  });
})();
</script>
</body>
</html>
