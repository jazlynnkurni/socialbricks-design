<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fostr · Icon rail + animated tooltip</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* v5 — ICON RAIL + ANIMATED TOOLTIP. Only layout + motion lives here. */

  :root{
    --rail-w: 76px;      /* compact icon-only rail */
    --drawer-w: 256px;   /* expanded labeled drawer */
    --ease: cubic-bezier(.22,.61,.36,1);
    --lift: cubic-bezier(.34,1.4,.5,1); /* gentle overshoot for the active lift */
  }

  .app{
    display:flex;
    height:100%;
    min-height:100vh;
  }

  /* ---- The rail / drawer shell ---------------------------------------- */
  .rail{
    position:relative;
    z-index:20;
    flex:0 0 auto;
    width:var(--rail-w);
    background:var(--paper);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:14px 0 12px;
    transition:width .42s var(--ease);
    /* overflow visible so tooltips can escape the rail; drawer clips its own */
  }
  .rail.expanded{ width:var(--drawer-w); }

  /* ---- Brand row ------------------------------------------------------- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    height:44px;
    padding:0 18px;
    margin-bottom:8px;
  }
  .brand .mark{
    width:30px;height:30px;flex:0 0 auto;
    display:block;
  }
  .brand .wordmark{
    height:19px;
    opacity:0;
    transform:translateX(-6px);
    transition:opacity .3s var(--ease) .06s, transform .34s var(--ease) .06s;
    pointer-events:none;
    white-space:nowrap;
  }
  .rail.expanded .brand .wordmark{ opacity:1; transform:none; }

  /* ---- Nav ------------------------------------------------------------- */
  nav{ flex:1 1 auto; overflow-y:auto; overflow-x:visible; padding:6px 0; }
  .rail.expanded nav{ overflow-x:hidden; } /* labels stay contained when open */

  .section{ margin-top:10px; }
  .section:first-child{ margin-top:0; }

  .sec-label{
    height:0;
    padding:0 20px;
    margin:0;
    opacity:0;
    overflow:hidden;
    transform:translateX(-4px);
    transition:height .3s var(--ease), opacity .24s var(--ease), transform .3s var(--ease), margin .3s var(--ease);
  }
  .rail.expanded .sec-label{
    height:auto;
    opacity:1;
    transform:none;
    margin:14px 0 4px;
  }

  ul{ list-style:none; margin:0; padding:0; }

  .navlink{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    height:var(--tap);
    min-height:var(--tap);
    padding:0;
    margin:2px 14px;
    width:calc(100% - 28px);
    border:0;
    background:transparent;
    border-radius:13px;
    color:var(--ink-2);
    cursor:pointer;
    text-align:left;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  /* compact: center the icon in the rail; expanded: give it a left gutter */
  .navlink .ico-wrap{
    position:relative;
    flex:0 0 auto;
    width:48px;
    height:44px;
    display:grid;
    place-items:center;
    transition:width .42s var(--ease);
  }
  .rail.expanded .navlink .ico-wrap{ width:44px; margin-left:2px; }

  .navlink svg{
    width:21px;height:21px;
    display:block;
    transition:transform .28s var(--lift), color .2s var(--ease);
  }

  .navlink .label{
    flex:1 1 auto;
    font-size:.905rem;
    font-weight:500;
    white-space:nowrap;
    opacity:0;
    transform:translateX(-6px);
    transition:opacity .26s var(--ease), transform .3s var(--ease);
    pointer-events:none;
  }
  .rail.expanded .navlink .label{ opacity:1; transform:none; pointer-events:auto; }

  /* hover / focus feedback */
  .navlink:hover{ background:var(--teal-tint); color:var(--teal-deep); }
  .navlink:hover svg{ transform:translateY(-1px); }
  .navlink:focus-visible{ outline:2px solid var(--teal); outline-offset:-2px; }

  /* ---- ACTIVE state: lift + soft teal glow indicator ------------------ */
  .navlink[aria-current="page"]{ color:var(--teal-deep); }
  /* glow pad sits behind the icon */
  .ico-wrap::before{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:12px;
    background:var(--teal-tint);
    box-shadow:0 4px 14px -4px color-mix(in srgb, var(--teal) 55%, transparent);
    opacity:0;
    transform:scale(.7);
    transition:opacity .3s var(--ease), transform .34s var(--lift);
  }
  .navlink[aria-current="page"] .ico-wrap::before{ opacity:1; transform:scale(1); }
  .navlink[aria-current="page"] svg{
    color:var(--teal);
    transform:translateY(-2px); /* the lift */
  }
  /* the little rail edge indicator (compact mode reads it at a glance) */
  .navlink::after{
    content:"";
    position:absolute;
    left:-14px;
    top:50%;
    width:3px;height:0;
    border-radius:0 3px 3px 0;
    background:var(--teal);
    transform:translateY(-50%);
    transition:height .34s var(--lift);
  }
  .navlink[aria-current="page"]::after{ height:22px; }

  /* ---- Animated tooltip (compact mode only) --------------------------- */
  .tip{
    position:absolute;
    left:calc(var(--rail-w) - 6px);
    top:50%;
    transform:translateY(-50%) translateX(-6px);
    background:var(--ink);
    color:#fff;
    font-size:.8rem;
    font-weight:500;
    line-height:1;
    padding:9px 11px;
    border-radius:9px;
    white-space:nowrap;
    box-shadow:0 8px 22px -8px rgba(20,30,28,.5);
    opacity:0;
    pointer-events:none;
    z-index:60;
    transition:opacity .18s var(--ease), transform .26s var(--lift);
  }
  .tip::before{ /* caret */
    content:"";
    position:absolute;
    left:-4px;top:50%;
    width:8px;height:8px;
    background:var(--ink);
    transform:translateY(-50%) rotate(45deg);
    border-radius:1px;
  }
  /* show on hover/focus, but never when expanded */
  .rail:not(.expanded) .navlink:hover .tip,
  .rail:not(.expanded) .navlink:focus-visible .tip{
    opacity:1;
    transform:translateY(-50%) translateX(0);
  }
  .rail.expanded .tip{ display:none; }

  /* ---- Footer: user + logout + toggle --------------------------------- */
  .foot{
    border-top:1px solid var(--line);
    padding-top:10px;
    margin-top:4px;
  }
  .user{
    display:flex;
    align-items:center;
    gap:12px;
    height:52px;
    margin:2px 14px;
    width:calc(100% - 28px);
    padding:0;
    border:0;background:transparent;
    border-radius:13px;
    cursor:default;
  }
  .avatar{
    flex:0 0 auto;
    width:48px;height:44px;
    display:grid;place-items:center;
  }
  .avatar span{
    width:34px;height:34px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--teal-deep);
    color:#fff;
    font-size:.78rem;font-weight:600;
    letter-spacing:.02em;
  }
  .who{
    min-width:0;
    opacity:0;transform:translateX(-6px);
    transition:opacity .26s var(--ease) .04s, transform .3s var(--ease) .04s;
    pointer-events:none;
    white-space:nowrap;
  }
  .rail.expanded .who{ opacity:1;transform:none;pointer-events:auto; }
  .who .nm{ font-size:.86rem;font-weight:600;color:var(--ink);line-height:1.15; }
  .who .rl{ font-size:.74rem;color:var(--ink-3); }

  .logout{
    display:flex;align-items:center;gap:14px;
    height:var(--tap);min-height:var(--tap);
    margin:2px 14px;width:calc(100% - 28px);
    border:0;background:transparent;border-radius:13px;
    color:var(--ink-3);cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .logout .ico-wrap{ width:48px; }
  .rail.expanded .logout .ico-wrap{ width:44px;margin-left:2px; }
  .logout svg{ width:20px;height:20px; }
  .logout .label{
    font-size:.86rem;font-weight:500;white-space:nowrap;
    opacity:0;transform:translateX(-6px);
    transition:opacity .26s var(--ease),transform .3s var(--ease);
  }
  .rail.expanded .logout .label{ opacity:1;transform:none; }
  .logout:hover{ background:var(--line-2);color:var(--ink-2); }
  .logout:focus-visible{ outline:2px solid var(--teal);outline-offset:-2px; }
  .logout:hover .tip{ opacity:0; } /* logout has its own tip below */
  .rail:not(.expanded) .logout:hover .tip,
  .rail:not(.expanded) .logout:focus-visible .tip{ opacity:1;transform:translateY(-50%) translateX(0); }

  /* ---- Collapse / expand toggle --------------------------------------- */
  .toggle{
    position:absolute;
    top:26px;
    right:-13px;
    z-index:40;
    width:26px;height:26px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink-2);
    cursor:pointer;
    box-shadow:0 2px 8px -3px rgba(20,30,28,.22);
    transition:background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .toggle:hover{ color:var(--teal-deep);border-color:color-mix(in srgb,var(--teal) 40%,var(--line));box-shadow:0 4px 12px -3px color-mix(in srgb,var(--teal) 45%,transparent); }
  .toggle:focus-visible{ outline:2px solid var(--teal);outline-offset:2px; }
  .toggle svg{ width:15px;height:15px;transition:transform .42s var(--lift); }
  .rail.expanded .toggle svg{ transform:rotate(180deg); }

  /* ---- Mock content ---------------------------------------------------- */
  .content{ flex:1 1 auto;min-width:0;display:flex;flex-direction:column; }
  .topbar{
    height:64px;flex:0 0 auto;
    display:flex;align-items:center;gap:14px;
    padding:0 26px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .topbar h1{ font-size:1.05rem;font-weight:600;margin:0;letter-spacing:-.01em; }
  .crumb{ font-size:.8rem;color:var(--ink-3); }
  .topbar .spacer{ flex:1; }
  .pill{
    font-size:.74rem;font-weight:600;color:var(--teal-deep);
    background:var(--teal-tint);padding:5px 11px;border-radius:999px;
  }
  .canvas{ flex:1;overflow:auto;padding:30px 34px; }
  .card-row{ display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:820px; }
  .card{
    background:color-mix(in srgb,var(--paper) 84%,transparent);
    border:1px solid var(--line);border-radius:16px;
    padding:16px;height:118px;backdrop-filter:blur(2px);
  }
  .card .k{ font-size:.72rem;color:var(--ink-3);font-weight:600;letter-spacing:.02em; }
  .card .v{ font-size:1.5rem;font-weight:600;margin-top:6px;letter-spacing:-.02em; }
  .card .bar{ height:6px;border-radius:4px;background:var(--line);margin-top:16px;overflow:hidden; }
  .card .bar i{ display:block;height:100%;background:var(--teal);border-radius:4px; }
  .lede{ max-width:560px;margin:0 0 22px; }
  .lede h2{ font-size:1.35rem;font-weight:600;margin:0 0 6px;letter-spacing:-.02em; }
  .lede p{ margin:0;color:var(--ink-2);font-size:.92rem; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>

<div class="app">

<script>
  (function(){
    var rail   = document.getElementById('rail');
    var toggle = document.getElementById('toggle');
    var links  = Array.prototype.slice.call(rail.querySelectorAll('.navlink'));

    // Expand / collapse the rail into the labeled drawer.
    toggle.addEventListener('click', function(){
      var open = rail.classList.toggle('expanded');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? 'Collapse sidebar' : 'Expand sidebar');
      toggle.setAttribute('title', open ? 'Collapse sidebar' : 'Expand sidebar');
    });

    // Clicking a nav item updates the active state (animated via CSS).
    links.forEach(function(link){
      link.addEventListener('click', function(){
        links.forEach(function(l){ l.removeAttribute('aria-current'); });
        link.setAttribute('aria-current', 'page');

        var label = link.querySelector('.label').textContent.trim();
        var crumbEl = document.querySelector('.topbar .crumb');
        var titleEl = document.querySelector('.topbar h1');
        // find the section label for a truthful breadcrumb
        var group = link.closest('.section');
        var sec = group ? group.querySelector('.sec-label').textContent.trim() : '';
        if (crumbEl) crumbEl.textContent = sec;
        if (titleEl) titleEl.textContent = label;
      });
    });
  })();
</script>
